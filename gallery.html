<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a08;
    --ink-2:#151210;
    --paper:#f3ead6;
    --paper-dim:rgba(243,234,214,0.55);
    --paper-faint:rgba(243,234,214,0.16);
    --brass:#c9a227;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--ink);height:100%;}
  body{
    color:var(--paper);
    font-family:'Space Mono',monospace;
    min-height:100vh;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(243,234,214,0.035) 1px, transparent 1px);
    background-size:3px 3px;opacity:0.5;
  }

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(10,9,8,0.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--paper-faint);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .back{color:var(--paper-dim);text-decoration:none;font-size:0.72rem;letter-spacing:0.05em;}
  .back:hover{color:var(--brass);}
  .g-title{font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;letter-spacing:0.01em;}

  .wall{
    position:relative;z-index:1;
    column-count:2;
    column-gap:8px;
    padding:12px 12px 120px;
    max-width:640px;margin:0 auto;
  }
  @media(min-width:520px){ .wall{column-count:3;} }

  .status{
    color:var(--paper-dim);font-size:0.75rem;
    padding:60px 20px;text-align:center;line-height:1.7;
    grid-column:1/-1;column-span:all;
  }

  .wall-item{
    break-inside:avoid;
    margin-bottom:8px;
    position:relative;
    overflow:hidden;
    border:1px solid var(--paper-faint);
    cursor:pointer;
    animation:tileIn 0.4s ease both;
  }
  @keyframes tileIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .wall-item.feature{ column-span:all; }
  .wall-item img,.wall-item video{
    width:100%;display:block;
  }
  .wall-item .video-mark{
    position:absolute;bottom:8px;left:8px;
    background:rgba(12,10,8,0.7);
    color:var(--paper);
    font-size:0.62rem;letter-spacing:0.05em;
    padding:4px 7px;
    pointer-events:none;
  }

  /* ---- upload FAB + panel ---- */
  .fab{
    position:fixed;right:18px;bottom:22px;z-index:30;
    background:var(--brass);color:var(--ink);
    font-family:'Space Mono',monospace;font-weight:700;
    font-size:0.75rem;letter-spacing:0.04em;
    border:none;padding:14px 18px;
    cursor:pointer;
  }
  .fab:active{transform:scale(0.97);}

  .upload-panel{
    position:fixed;inset:0;z-index:40;
    background:rgba(0,0,0,0.7);
    display:none;align-items:flex-end;justify-content:center;
  }
  .upload-panel.open{display:flex;}
  .upload-sheet{
    background:var(--ink-2);
    border-top:1px solid var(--paper-faint);
    width:100%;max-width:480px;
    padding:22px 20px 30px;
    animation:sheetUp 0.25s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .upload-sheet h3{
    font-family:'Fraunces',serif;font-weight:900;font-size:1.1rem;margin-bottom:16px;
  }
  .upload-choices{display:flex;gap:10px;margin-bottom:14px;}
  .upload-choice{
    flex:1;background:transparent;border:1px solid var(--paper-faint);
    color:var(--paper);padding:20px 10px;
    font-family:'Space Mono',monospace;font-size:0.78rem;letter-spacing:0.04em;
    cursor:pointer;
  }
  .upload-choice:hover,.upload-choice:focus-visible{border-color:var(--brass);color:var(--brass);}
  .upload-cancel{
    width:100%;background:none;border:none;color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.72rem;
    padding:10px;cursor:pointer;letter-spacing:0.04em;
  }
  .upload-progress{
    display:none;
    margin-top:8px;
  }
  .upload-progress.show{display:block;}
  .progress-track{
    height:3px;background:var(--paper-faint);overflow:hidden;position:relative;
  }
  .progress-fill{
    position:absolute;top:0;left:0;height:100%;width:40%;
    background:var(--brass);
    animation:scan 1.1s ease-in-out infinite;
  }
  @keyframes scan{
    0%{left:-40%;}
    100%{left:100%;}
  }
  .progress-text{
    margin-top:8px;font-size:0.68rem;color:var(--paper-dim);letter-spacing:0.04em;
  }

  /* ---- full-screen viewer ---- */
  .viewer{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,0.96);
    display:none;align-items:center;justify-content:center;
    flex-direction:column;
  }
  .viewer.open{display:flex;}
  .viewer-stage{
    flex:1;width:100%;display:flex;align-items:center;justify-content:center;
    padding:60px 16px;position:relative;
  }
  .viewer-stage img,.viewer-stage video{
    max-width:100%;max-height:100%;
  }
  .viewer-btn{
    background:none;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.9rem;
    width:42px;height:42px;
    cursor:pointer;
  }
  .viewer-top{
    position:absolute;top:16px;left:16px;right:16px;
    display:flex;justify-content:space-between;z-index:2;
  }
  .viewer-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    z-index:2;
  }
  .viewer-prev{left:10px;}
  .viewer-next{right:10px;}
  .viewer-bottom{
    padding:12px 16px 26px;
    display:flex;justify-content:center;gap:10px;
  }
  .viewer-dl{
    text-decoration:none;color:var(--ink);background:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.04em;
    padding:10px 16px;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html">← BACK</a>
  <span class="g-title">GALLERY</span>
  <span style="width:52px;"></span>
</header>

<div class="wall" id="wall">
  <div class="status" id="status">loading memories…</div>
</div>

<button class="fab" id="uploadFab">+ UPLOAD</button>

<div class="upload-panel" id="uploadPanel">
  <div class="upload-sheet">
    <h3>Add to the gallery</h3>
    <div class="upload-choices">
      <button class="upload-choice" id="choosePhoto">📷 PHOTO</button>
      <button class="upload-choice" id="chooseVideo">🎥 VIDEO</button>
    </div>
    <div class="upload-progress" id="uploadProgress">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-text" id="progressText">uploading…</div>
    </div>
    <button class="upload-cancel" id="uploadCancel">CANCEL</button>
  </div>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileVideo" accept="video/*" hidden>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-top">
      <button class="viewer-btn" id="viewerClose">✕</button>
      <span></span>
    </div>
    <button class="viewer-btn viewer-nav viewer-prev" id="viewerPrev">←</button>
    <div id="viewerMedia"></div>
    <button class="viewer-btn viewer-nav viewer-next" id="viewerNext">→</button>
  </div>
  <div class="viewer-bottom">
    <a class="viewer-dl" id="viewerDownload" href="#" download>DOWNLOAD</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://yesfebylerfhofhybtdp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8rlJJfAHpciqCHvA1VmLAA_uWzj-p4w';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const wall = document.getElementById('wall');
const statusEl = document.getElementById('status');
let items = [];

async function loadGallery(){
  const { data, error } = await supabase
    .from('gallery_items')
    .select('id, media_url, media_type, media_name, created_at')
    .order('created_at', { ascending: false });

  if(error){
    statusEl.textContent = 'could not load the gallery — check connection.';
    return;
  }
  items = data || [];
  renderWall();
}

function renderWall(){
  wall.innerHTML = '';
  if(items.length === 0){
    const s = document.createElement('div');
    s.className = 'status';
    s.textContent = 'no memories uploaded yet — tap + UPLOAD to add the first one.';
    wall.appendChild(s);
    return;
  }
  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'wall-item' + (i % 7 === 3 ? ' feature' : '');
    el.style.animationDelay = (Math.min(i, 10) * 0.03) + 's';
    if(item.media_type === 'video'){
      const vid = document.createElement('video');
      vid.src = item.media_url; vid.muted = true; vid.playsInline = true;
      el.appendChild(vid);
      const mark = document.createElement('span');
      mark.className = 'video-mark';
      mark.textContent = '▶ VIDEO';
      el.appendChild(mark);
    } else {
      const img = document.createElement('img');
      img.src = item.media_url; img.loading = 'lazy'; img.alt = '';
      el.appendChild(img);
    }
    el.onclick = () => openViewer(i);
    wall.appendChild(el);
  });
}

// ---- full-screen viewer ----
const viewer = document.getElementById('viewer');
const viewerMedia = document.getElementById('viewerMedia');
const viewerDownload = document.getElementById('viewerDownload');
let currentIndex = 0;

function openViewer(i){
  currentIndex = i;
  renderViewer();
  viewer.classList.add('open');
}
function renderViewer(){
  const item = items[currentIndex];
  viewerMedia.innerHTML = '';
  if(item.media_type === 'video'){
    const v = document.createElement('video');
    v.src = item.media_url; v.controls = true; v.autoplay = true;
    viewerMedia.appendChild(v);
  } else {
    const im = document.createElement('img');
    im.src = item.media_url;
    viewerMedia.appendChild(im);
  }
  viewerDownload.href = item.media_url;
  viewerDownload.setAttribute('download', item.media_name || 'memory');
}
document.getElementById('viewerClose').onclick = () => { viewer.classList.remove('open'); viewerMedia.innerHTML=''; };
document.getElementById('viewerPrev').onclick = () => { currentIndex = (currentIndex - 1 + items.length) % items.length; renderViewer(); };
document.getElementById('viewerNext').onclick = () => { currentIndex = (currentIndex + 1) % items.length; renderViewer(); };

// ---- upload flow ----
const uploadFab = document.getElementById('uploadFab');
const uploadPanel = document.getElementById('uploadPanel');
const uploadProgress = document.getElementById('uploadProgress');
const progressText = document.getElementById('progressText');
const fileImage = document.getElementById('fileImage');
const fileVideo = document.getElementById('fileVideo');

uploadFab.onclick = () => uploadPanel.classList.add('open');
document.getElementById('uploadCancel').onclick = () => uploadPanel.classList.remove('open');
uploadPanel.addEventListener('click', e => { if(e.target === uploadPanel) uploadPanel.classList.remove('open'); });
document.getElementById('choosePhoto').onclick = () => fileImage.click();
document.getElementById('chooseVideo').onclick = () => fileVideo.click();

fileImage.addEventListener('change', e => { if(e.target.files[0]) doUpload(e.target.files[0], 'image'); });
fileVideo.addEventListener('change', e => { if(e.target.files[0]) doUpload(e.target.files[0], 'video'); });

async function doUpload(file, type){
  uploadProgress.classList.add('show');
  progressText.textContent = 'uploading…';

  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const path = `${type}/${Date.now()}_${safeName}`;

  const { error: upErr } = await supabase.storage.from('gallery').upload(path, file, {
    cacheControl: '3600',
    upsert: false
  });

  if(upErr){
    progressText.textContent = 'upload failed — try again.';
    setTimeout(() => uploadProgress.classList.remove('show'), 1800);
    return;
  }

  const { data: pub } = supabase.storage.from('gallery').getPublicUrl(path);

  const { error: insErr } = await supabase.from('gallery_items').insert({
    media_url: pub.publicUrl,
    media_type: type,
    media_name: file.name
  });

  if(insErr){
    progressText.textContent = 'saved file, but could not add it to the wall.';
    setTimeout(() => uploadProgress.classList.remove('show'), 2200);
    return;
  }

  progressText.textContent = '✓ uploaded';
  setTimeout(() => {
    uploadProgress.classList.remove('show');
    uploadPanel.classList.remove('open');
    fileImage.value = '';
    fileVideo.value = '';
  }, 700);

  loadGallery();
}

loadGallery();
</script>
</body>
</html>
