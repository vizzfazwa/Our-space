<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  if (sessionStorage.getItem('story_unlocked') !== '1') {
    location.replace('lock-screen.html');
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Sketches — Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0c0a08;--paper:#f3ead6;--paper-dim:rgba(243,234,214,.55);--paper-faint:rgba(243,234,214,.16);--brass:#c9a227;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--ink);}
  body{background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;padding:44px 20px 70px;}
  .wrap{max-width:560px;margin:0 auto;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px;}
  .navrow a{color:var(--paper-dim);text-decoration:none;}
  .navrow a:hover{color:var(--brass);}
  .hero{text-align:center;padding:6px 0 32px;}
  .hero h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2rem,9vw,2.8rem);line-height:1;}
  .hero p{font-family:'Fraunces',serif;font-style:italic;color:var(--paper-dim);margin-top:10px;font-size:.9rem;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sk-card{border:1px solid var(--paper-faint);border-radius:4px;overflow:hidden;cursor:pointer;background:#000;}
  .sk-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000;}
  .sk-meta{padding:8px 9px;font-size:.6rem;color:var(--paper-dim);line-height:1.5;}
  .sk-meta b{color:var(--paper);display:block;font-size:.64rem;}
  .empty{text-align:center;color:var(--paper-dim);font-size:.8rem;padding:60px 0;font-family:'Fraunces',serif;font-style:italic;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:70vh;border-radius:4px;}
  .lightbox .lb-meta{color:var(--paper-dim);font-size:.72rem;margin-top:16px;text-align:center;line-height:1.7;}
  .lightbox .lb-close{position:absolute;top:18px;right:20px;background:none;border:1px solid var(--paper-faint);color:var(--paper);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navrow">
    <a href="index.html">← Our Space</a>
  </div>
  <div class="hero">
    <h1>OUR SKETCHES</h1>
    <p>Every little drawing, saved forever in our memories.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <img id="lbImg" src="">
  <div class="lb-meta" id="lbMeta"></div>
</div>

<script>
const SB='https://qrtzkmbdjuubzegcuadu.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFydHprbWJkanV1YnplZ2N1YWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTU0NDAsImV4cCI6MjA5NzAzMTQ0MH0.wM1PqYVFkSgBWH1mEN3YrL-qPBuDd6P3ZjPuFPjsZ1k';
async function api(path){
  try{
    const r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    return await r.json();
  }catch(e){return null;}
}
const NAMES={fawaz:'🧸 Fawaz',pathumma:'👰🏻\u200d♀️ Vismaya'};
function displayNames(csv){
  if(!csv)return 'Someone';
  return csv.split(',').map(k=>NAMES[k]||k).join(' & ');
}
function fmtDate(d){
  if(!d)return '';
  return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let sketches=[];
function openLightbox(i){
  const s=sketches[i];
  document.getElementById('lbImg').src=s.image_data;
  document.getElementById('lbMeta').innerHTML=
    '<b style="color:var(--paper);font-size:.78rem;">'+esc(displayNames(s.drawn_by))+' drew this</b>'+
    'saved by '+esc(displayNames(s.saved_by))+'<br>'+esc(fmtDate(s.created_at));
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}

(async function(){
  const rows=await api('sketches?select=*&order=created_at.desc');
  sketches=Array.isArray(rows)?rows:[];
  const grid=document.getElementById('grid');
  if(!sketches.length){
    grid.outerHTML='<div class="empty">No sketches saved yet — once you two save one from the live canvas, it\u2019ll appear here. 🎨</div>';
    return;
  }
  grid.innerHTML=sketches.map((s,i)=>
    '<div class="sk-card" onclick="openLightbox('+i+')">'+
      '<img src="'+s.image_data+'" loading="lazy">'+
      '<div class="sk-meta"><b>'+esc(displayNames(s.drawn_by))+'</b>saved by '+esc(displayNames(s.saved_by))+'<br>'+esc(fmtDate(s.created_at))+'</div>'+
    '</div>'
  ).join('');
})();
</script>
</body>
</html>
