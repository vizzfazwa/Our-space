<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // if this session already unlocked the site, skip straight to Home —
  // this is what makes every other page's "← BACK" link work without a loop
  if (sessionStorage.getItem('story_unlocked') === '1') {
    location.replace('index.html');
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Private Memory Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #211a30;
    --lavender: #6f5f97;
    --lavender-soft: #c3b3e6;
    --lavender-glow: rgba(159,132,214,0.35);
    --rose: #d9a679;
    --rose-bright: #f3cfa3;
    --rose-glow: rgba(217,166,121,0.4);
    --warm-white: #faf5ee;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Quicksand',sans-serif;
    color:var(--warm-white);
    background:
      radial-gradient(ellipse 90% 60% at 50% 8%, rgba(217,166,121,0.16), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 100%, rgba(38,28,56,0.9), transparent 60%),
      linear-gradient(160deg, #362a4d 0%, #241b36 45%, #1a1426 100%);
    position:relative;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding: env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);
  }
  body::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(15,11,22,0.55) 100%);
  }

  /* ---- moon ---- */
  .moon{
    position:absolute; top:9%; right:14%;
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff, #f1e8ff 35%, var(--lavender-soft) 75%);
    box-shadow:
      -14px 4px 0 -2px #241b36 inset,
      0 0 30px 6px rgba(220,205,255,0.35),
      0 0 60px 18px rgba(217,166,121,0.12);
    animation: moonFloat 8s ease-in-out infinite;
  }
  @keyframes moonFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

  /* ---- stars & particles layers ---- */
  .sky, .particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .star{
    position:absolute; border-radius:50%; background:#fff;
    box-shadow:0 0 4px 1px rgba(255,255,255,0.8);
    animation-name: twinkle; animation-iteration-count:infinite; animation-timing-function: ease-in-out;
  }
  @keyframes twinkle{ 0%,100%{ opacity:0.15; } 50%{ opacity:1; } }

  .shooting-star{
    position:absolute; width:2px;height:2px; background:#fff; border-radius:50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.9);
    opacity:0;
  }
  .shooting-star::before{
    content:''; position:absolute; top:50%; right:0; width:90px; height:1px;
    background:linear-gradient(to left, rgba(255,255,255,0.9), transparent);
    transform:translateY(-50%);
  }
  .shooting-star.fly{ animation: shoot 1.1s ease-out forwards; }
  @keyframes shoot{
    0%{ opacity:0; transform:translate(0,0); }
    8%{ opacity:1; }
    100%{ opacity:0; transform:translate(-220px,140px); }
  }

  .particle{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(243,207,163,0.9), rgba(243,207,163,0) 70%);
    animation-name: drift; animation-iteration-count:infinite; animation-timing-function:linear;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.5; }
    100%{ transform:translate(var(--dx), -46vh); opacity:0; }
  }
  .particles.fast .particle{ animation-duration:6s !important; }

  /* ---- card ---- */
  .card{
    position:relative; z-index:2;
    width:100%; max-width:380px;
    background:linear-gradient(150deg, rgba(255,255,255,0.14), rgba(159,132,214,0.08));
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border:1px solid rgba(243,207,163,0.32);
    border-radius:26px;
    padding:40px 26px 32px;
    text-align:center;
    box-shadow:
      0 20px 60px rgba(15,10,25,0.55),
      0 0 50px rgba(159,132,214,0.18),
      inset 0 1px 1px rgba(255,255,255,0.25);
    transition: box-shadow 0.6s ease, background 0.6s ease;
  }
  .card.shake{ animation: shake 0.5s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(3px); }
  }
  .card.unlocking{
    box-shadow:
      0 20px 70px rgba(15,10,25,0.55),
      0 0 90px rgba(243,207,163,0.45),
      inset 0 1px 1px rgba(255,255,255,0.4);
    background:linear-gradient(150deg, rgba(255,255,255,0.22), rgba(243,207,163,0.14));
  }

  .lock-icon{
    font-size:2.5rem; display:inline-block;
    filter:drop-shadow(0 0 10px rgba(243,207,163,0.5));
    animation: breathe-icon 3.2s ease-in-out infinite;
  }
  @keyframes breathe-icon{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .lock-icon.tiny-shake{ animation: tinyShake 0.4s ease; }
  @keyframes tinyShake{ 0%,100%{ transform:rotate(0); } 30%{ transform:rotate(-8deg); } 60%{ transform:rotate(8deg); } }
  .lock-icon.flip{ animation: flipUnlock 0.6s ease forwards; }
  @keyframes flipUnlock{
    0%{ transform:rotateY(0) scale(1); }
    50%{ transform:rotateY(90deg) scale(1.2); }
    100%{ transform:rotateY(0) scale(1.15); }
  }

  h1{
    font-family:'Playfair Display', serif; font-weight:600; font-style:italic;
    font-size:1.5rem; letter-spacing:0.02em; margin-top:14px;
    color:var(--warm-white);
    text-shadow:0 0 22px rgba(243,207,163,0.35);
  }
  .subtitle{
    margin-top:10px; font-size:0.82rem; font-weight:500; font-style:italic;
    color:var(--lavender-soft); line-height:1.5; padding:0 6px;
  }

  /* ---- input ---- */
  .input-wrap{
    position:relative; margin-top:30px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:16px;
    padding:16px 18px;
    min-height:54px;
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    cursor:text;
  }
  .input-wrap.focused{
    border-color: rgba(243,207,163,0.7);
    box-shadow: 0 0 0 4px rgba(159,132,214,0.18), 0 0 24px rgba(243,207,163,0.25);
    background:rgba(255,255,255,0.09);
  }
  .input-wrap.rose-tint{
    border-color: rgba(217,120,120,0.6);
    background:rgba(217,120,120,0.08);
  }
  .placeholder-text{
    position:absolute; left:0; right:0; text-align:center;
    font-size:0.82rem; color:rgba(250,245,238,0.4); pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .dot-row{ display:flex; gap:9px; align-items:center; justify-content:center; min-height:14px; flex-wrap:wrap; }
  .dot{
    width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-bright) 45%, var(--rose) 100%);
    box-shadow:0 0 7px rgba(243,207,163,0.65);
    transform:scale(0);
    animation: dotPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes dotPop{ 0%{ transform:scale(0); opacity:0; } 55%{ transform:scale(1.35); opacity:1; } 100%{ transform:scale(1); } }
  .real-input{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:none; outline:none; background:transparent;
    font-size:16px; /* prevents iOS zoom */
  }
  .keystroke-spark{
    position:absolute; font-size:0.7rem; color:var(--rose-bright); pointer-events:none;
    animation: sparkleUp 0.6s ease forwards;
  }
  @keyframes sparkleUp{
    0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--kx),-22px) scale(0.4) rotate(45deg); }
  }

  .wrong-msg{
    margin-top:14px; font-size:0.78rem; font-style:italic; color:#e8b9b9;
    opacity:0; transition:opacity 0.5s ease; min-height:1.1em;
  }
  .wrong-msg.show{ opacity:1; }

  /* ---- enter button ---- */
  .enter-btn{
    position:relative; overflow:hidden;
    width:100%; margin-top:22px;
    background:linear-gradient(135deg, var(--rose-bright), var(--rose));
    color:#3a2a1c; font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.92rem;
    letter-spacing:0.06em; border:none; border-radius:999px;
    padding:15px 20px; cursor:pointer;
    box-shadow:0 8px 22px rgba(217,166,121,0.35), inset 0 1px 1px rgba(255,255,255,0.4);
    animation: breatheBtn 3.4s ease-in-out infinite;
    transition: transform 0.2s ease;
  }
  @keyframes breatheBtn{
    0%,100%{ box-shadow:0 8px 22px rgba(217,166,121,0.35), inset 0 1px 1px rgba(255,255,255,0.4); }
    50%{ box-shadow:0 8px 30px rgba(217,166,121,0.6), inset 0 1px 1px rgba(255,255,255,0.5); }
  }
  .enter-btn::after{
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    transition:left 0.7s ease;
  }
  .enter-btn:hover{ transform:translateY(-2px); }
  .enter-btn:hover::after{ left:130%; }
  .enter-btn:active{ transform:scale(0.96); }

  /* ---- success flash ---- */
  .unlock-flash{
    position:fixed; inset:0; z-index:10; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .unlock-flash .ripple{
    width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,244,230,0.95), rgba(243,207,163,0.5) 40%, transparent 70%);
    opacity:0; transform:scale(0);
  }
  .unlock-flash.go .ripple{
    animation: rippleGrow 1.3s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rippleGrow{
    0%{ opacity:0; transform:scale(0); }
    15%{ opacity:1; }
    100%{ opacity:1; transform:scale(220); }
  }

  @media (max-width:380px){
    .card{ padding:34px 20px 26px; }
    h1{ font-size:1.3rem; }
    .moon{ width:48px; height:48px; top:6%; right:10%; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<div class="particles" id="particles"></div>
<div class="moon"></div>

<div class="card" id="card">
  <div class="lock-icon" id="lockIcon">🔒</div>
  <h1>Private Memory Space</h1>
  <p class="subtitle">Some memories are meant to stay between two hearts.</p>

  <div class="input-wrap" id="inputWrap">
    <span class="placeholder-text" id="placeholderText">Enter the secret password</span>
    <div class="dot-row" id="dotRow"></div>
    <input type="password" class="real-input" id="realInput" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="wrong-msg" id="wrongMsg">Not this memory... try again.</div>

  <button class="enter-btn" id="enterBtn">ENTER ✦</button>
</div>

<div class="unlock-flash" id="unlockFlash"><div class="ripple"></div></div>

<script>
const PASSWORD = 'vizzfazz';

// ---- stars ----
const sky = document.getElementById('sky');
for(let i=0;i<42;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = (Math.random()*2 + 1).toFixed(1);
  s.style.width = size+'px'; s.style.height = size+'px';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*70+'%';
  s.style.animationDuration = (2 + Math.random()*3).toFixed(1)+'s';
  s.style.animationDelay = (Math.random()*4).toFixed(1)+'s';
  sky.appendChild(s);
}

// occasional shooting star
function launchShootingStar(){
  const s = document.createElement('div');
  s.className = 'shooting-star fly';
  s.style.top = (10 + Math.random()*25)+'%';
  s.style.left = (55 + Math.random()*35)+'%';
  sky.appendChild(s);
  setTimeout(()=> s.remove(), 1200);
  setTimeout(launchShootingStar, 7000 + Math.random()*9000);
}
setTimeout(launchShootingStar, 4000 + Math.random()*4000);

// ---- floating particles ----
const particlesEl = document.getElementById('particles');
for(let i=0;i<16;i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const size = (Math.random()*4 + 2).toFixed(1);
  p.style.width = size+'px'; p.style.height = size+'px';
  p.style.left = Math.random()*100+'%';
  p.style.top = (60 + Math.random()*40)+'%';
  p.style.setProperty('--dx', (Math.random()*60-30).toFixed(0)+'px');
  p.style.animationDuration = (14 + Math.random()*14).toFixed(1)+'s';
  p.style.animationDelay = (Math.random()*10).toFixed(1)+'s';
  particlesEl.appendChild(p);
}

// ---- password field ----
const inputWrap = document.getElementById('inputWrap');
const realInput = document.getElementById('realInput');
const dotRow = document.getElementById('dotRow');
const placeholderText = document.getElementById('placeholderText');
const wrongMsg = document.getElementById('wrongMsg');
const card = document.getElementById('card');
const lockIcon = document.getElementById('lockIcon');

inputWrap.addEventListener('click', () => realInput.focus());
realInput.addEventListener('focus', () => inputWrap.classList.add('focused'));
realInput.addEventListener('blur', () => inputWrap.classList.remove('focused'));

let prevLen = 0;
realInput.addEventListener('input', () => {
  const len = realInput.value.length;
  placeholderText.style.opacity = len ? '0' : '1';

  if(len > prevLen){
    const dot = document.createElement('span');
    dot.className = 'dot';
    dotRow.appendChild(dot);
    spawnSpark();
  } else if(len < prevLen && dotRow.lastElementChild){
    dotRow.lastElementChild.remove();
  }
  prevLen = len;
});

function spawnSpark(){
  const spark = document.createElement('span');
  spark.className = 'keystroke-spark';
  spark.textContent = '✦';
  spark.style.left = (48 + Math.random()*10)+'%';
  spark.style.top = '0';
  spark.style.setProperty('--kx', (Math.random()*16-8).toFixed(0)+'px');
  inputWrap.appendChild(spark);
  setTimeout(()=> spark.remove(), 650);
}

realInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
document.getElementById('enterBtn').addEventListener('click', tryUnlock);

function tryUnlock(){
  if(realInput.value === PASSWORD){
    runSuccess();
  } else {
    runWrong();
  }
}

function runWrong(){
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  lockIcon.classList.remove('tiny-shake'); void lockIcon.offsetWidth; lockIcon.classList.add('tiny-shake');
  inputWrap.classList.add('rose-tint');
  wrongMsg.classList.add('show');

  setTimeout(() => {
    inputWrap.classList.remove('rose-tint');
    dotRow.innerHTML = '';
    realInput.value = '';
    prevLen = 0;
    placeholderText.style.opacity = '1';
  }, 500);
  setTimeout(() => wrongMsg.classList.remove('show'), 2200);
}

function runSuccess(){
  realInput.disabled = true;
  document.getElementById('enterBtn').disabled = true;
  card.classList.add('unlocking');
  lockIcon.classList.add('flip');
  setTimeout(() => { lockIcon.textContent = '🔓'; }, 300);

  particlesEl.classList.add('fast');

  setTimeout(() => {
    document.getElementById('unlockFlash').classList.add('go');
  }, 500);

  setTimeout(() => {
    sessionStorage.setItem('story_unlocked', '1');
    window.location.href = 'index.html';
  }, 1700);
}
</script>
</body>
</html>
