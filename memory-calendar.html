<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Calendar — Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a08;
    --ink-2:#151210;
    --paper:#f3ead6;
    --paper-dim:rgba(243,234,214,0.55);
    --paper-faint:rgba(243,234,214,0.16);
    --paper-faint-2:rgba(243,234,214,0.08);
    --brass:#c9a227;
    --string:#a3182a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--ink);}
  body{
    color:var(--paper);
    font-family:'Space Mono',monospace;
    min-height:100vh;
    padding-bottom:60px;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(243,234,214,0.035) 1px, transparent 1px);
    background-size:3px 3px;opacity:0.5;
  }

  /* ---- topbar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(10,9,8,0.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--paper-faint);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .back{color:var(--paper-dim);text-decoration:none;font-size:0.72rem;letter-spacing:0.05em;}
  .back:hover{color:var(--brass);}
  .g-title{font-family:'Fraunces',serif;font-weight:900;font-size:1.05rem;letter-spacing:0.01em;}

  main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:24px 16px 0;}

  .page-head{text-align:center;margin-bottom:22px;}
  .page-head h1{font-family:'Fraunces',serif;font-weight:900;font-size:1.6rem;letter-spacing:0.01em;}
  .page-head p{margin-top:6px;font-size:0.72rem;letter-spacing:0.05em;color:var(--paper-dim);}

  /* ---- controls ---- */
  .controls{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  #searchInput{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.78rem;padding:11px 12px;width:100%;
  }
  #searchInput::placeholder{color:var(--paper-dim);}
  #searchInput:focus{outline:none;border-color:var(--brass);}
  .filters{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-chip{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.03em;
    padding:7px 11px;cursor:pointer;
  }
  .filter-chip.active{border-color:var(--brass);color:var(--brass);}

  /* ---- month nav ---- */
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
  }
  .month-nav button{
    background:none;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.85rem;
    width:38px;height:38px;cursor:pointer;
  }
  .month-nav button:hover{border-color:var(--brass);color:var(--brass);}
  .month-title{font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;text-align:center;}
  .year-divider{
    text-align:center;font-size:0.65rem;letter-spacing:0.08em;color:var(--brass);
    margin-bottom:14px;opacity:0.85;
  }

  /* ---- calendar grid ---- */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .weekdays span{
    text-align:center;font-size:0.6rem;letter-spacing:0.05em;color:var(--paper-dim);padding:6px 0;
  }
  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    gap:3px;border:1px solid var(--paper-faint);padding:3px;
    background:var(--paper-faint-2);
  }
  .day{
    aspect-ratio:1/1;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;cursor:default;
    font-size:0.72rem;color:var(--paper-dim);
  }
  .day.pad{opacity:0.25;}
  .day.today{border:1px solid var(--brass);}
  .day.has-memory{
    cursor:pointer;color:var(--paper);
    background:rgba(201,162,39,0.06);
  }
  .day.has-memory:hover{background:rgba(201,162,39,0.14);}
  .day.dimmed{opacity:0.2;}
  .day.selected{outline:1px solid var(--brass);}
  .day .num{font-weight:700;}
  .day .marks{position:absolute;bottom:5px;font-size:0.68rem;letter-spacing:-1px;}

  /* ---- detail card(s) ---- */
  .detail-wrap{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .detail-card{
    border:1px solid var(--paper-faint);background:var(--ink-2);padding:16px;
    animation:fadeIn 0.25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .detail-date{font-size:0.66rem;letter-spacing:0.06em;color:var(--paper-dim);margin-bottom:6px;}
  .detail-title{font-family:'Fraunces',serif;font-weight:900;font-size:1.05rem;margin-bottom:8px;}
  .detail-desc{font-size:0.78rem;line-height:1.6;color:var(--paper-dim);}
  .detail-toggle{
    margin-top:10px;background:none;border:none;color:var(--brass);
    font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.04em;
    cursor:pointer;padding:0;
  }

  /* ---- add memory ---- */
  .add-btn{
    display:block;width:100%;margin-top:18px;
    background:transparent;border:1px dashed var(--paper-faint);color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.75rem;letter-spacing:0.04em;
    padding:14px;cursor:pointer;
  }
  .add-btn:hover{border-color:var(--brass);color:var(--brass);}

  .sheet-panel{
    position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.7);
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-panel.open{display:flex;}
  .sheet{
    background:var(--ink-2);border-top:1px solid var(--paper-faint);
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:22px 20px 28px;animation:sheetUp 0.25s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-family:'Fraunces',serif;font-weight:900;font-size:1.1rem;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.66rem;letter-spacing:0.06em;color:var(--paper-dim);margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%;background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.78rem;padding:10px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .type-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .type-toggle{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper-dim);
    font-size:0.85rem;padding:8px 10px;cursor:pointer;
  }
  .type-toggle.selected{border-color:var(--brass);color:var(--brass);background:rgba(201,162,39,0.08);}
  .sheet-submit{
    width:100%;background:var(--brass);color:var(--ink);border:none;
    font-family:'Space Mono',monospace;font-weight:700;font-size:0.78rem;letter-spacing:0.04em;
    padding:13px;cursor:pointer;margin-top:4px;
  }
  .sheet-submit:disabled{opacity:0.5;cursor:default;}
  .sheet-cancel{
    width:100%;background:none;border:none;color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.72rem;padding:10px;cursor:pointer;letter-spacing:0.04em;
  }
  .form-msg{font-size:0.7rem;color:var(--paper-dim);margin-top:8px;min-height:1em;}

  /* ---- stats ---- */
  .stats{
    margin-top:26px;text-align:center;border-top:1px solid var(--paper-faint);
    padding-top:16px;
  }
  .stats-total{font-family:'Fraunces',serif;font-weight:900;font-size:1.3rem;}
  .stats-total span{color:var(--brass);}
  .stats-breakdown{margin-top:8px;font-size:0.78rem;color:var(--paper-dim);letter-spacing:0.04em;}
  .stats-breakdown b{color:var(--paper);}

  /* ---- birthdays ---- */
  .section-label{
    text-align:center;font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;
    margin-top:34px;margin-bottom:4px;
  }
  .section-sub{text-align:center;font-size:0.68rem;letter-spacing:0.05em;color:var(--paper-dim);margin-bottom:16px;}
  .bday-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bday-card{
    border:1px solid var(--paper-faint);padding:16px 10px;text-align:center;
  }
  .bday-card .icon{font-size:1.4rem;}
  .bday-card .date{font-family:'Fraunces',serif;font-weight:900;font-size:1rem;margin-top:6px;}
  .bday-card .who{font-size:0.68rem;letter-spacing:0.05em;color:var(--paper-dim);margin-top:2px;}
  .bday-card .born{font-size:0.65rem;color:var(--paper-dim);margin-top:8px;opacity:0.7;}

  .countdown{
    margin-top:12px;border:1px solid var(--brass);padding:16px;text-align:center;
  }
  .countdown .who{font-size:0.68rem;letter-spacing:0.05em;color:var(--paper-dim);}
  .countdown .date{font-family:'Fraunces',serif;font-weight:900;font-size:1rem;margin-top:2px;}
  .countdown .days{font-family:'Fraunces',serif;font-weight:900;font-size:1.9rem;color:var(--brass);margin-top:8px;}
  .countdown .days-label{font-size:0.62rem;letter-spacing:0.08em;color:var(--paper-dim);}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html">← BACK</a>
  <span class="g-title">MEMORY CALENDAR</span>
  <span style="width:52px;"></span>
</header>

<main>
  <div class="page-head">
    <h1>OUR STORY IN DAYS</h1>
    <p id="statusLine">loading memories…</p>
  </div>

  <div class="controls">
    <input id="searchInput" type="text" placeholder="search memories...">
    <div class="filters" id="filters"></div>
  </div>

  <div class="month-nav">
    <button id="prevMonth">←</button>
    <div class="month-title" id="monthTitle">—</div>
    <button id="nextMonth">→</button>
  </div>
  <div class="year-divider" id="yearDivider"></div>

  <div class="weekdays">
    <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
  </div>
  <div class="grid" id="grid"></div>

  <div class="detail-wrap" id="detailWrap"></div>

  <button class="add-btn" id="addBtn">＋ ADD NEW MEMORY</button>

  <div class="stats" id="statsBox">
    <div class="stats-total"><span id="statTotal">0</span> MEMORIES SAVED</div>
    <div class="stats-breakdown" id="statBreakdown"></div>
  </div>

  <div class="section-label">🎂 BIRTHDAYS</div>
  <div class="section-sub">Special Days • Special People</div>
  <div class="bday-grid" id="bdayGrid"></div>
  <div class="countdown" id="countdownBox"></div>
</main>

<div class="sheet-panel" id="sheetPanel">
  <div class="sheet">
    <h3>Add a memory</h3>
    <div class="field">
      <label>DATE</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>MEMORY TYPE (pick 1–2)</label>
      <div class="type-grid" id="typeGrid"></div>
    </div>
    <div class="field">
      <label>TITLE</label>
      <input type="text" id="fTitle" placeholder="e.g. She Sang A Song For Me">
    </div>
    <div class="field">
      <label>SHORT DESCRIPTION (optional)</label>
      <textarea id="fDesc" placeholder="A line or two about it..."></textarea>
    </div>
    <button class="sheet-submit" id="fSubmit">ADD TO CALENDAR</button>
    <button class="sheet-cancel" id="fCancel">CANCEL</button>
    <div class="form-msg" id="formMsg"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---- config (public anon key — safe to expose client-side) ----
// NOTE: calendar memories live in the GALLERY project, per instruction that
// everything except the main chat archive should be saved there going forward.
const SUPABASE_URL = 'https://yesfebylerfhofhybtdp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8rlJJfAHpciqCHvA1VmLAA_uWzj-p4w';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- memory types ----
const TYPES = [
  { key:'love',         icon:'❤️', label:'Love' },
  { key:'eye',           icon:'👀', label:'Eye Contact' },
  { key:'special',      icon:'✨', label:'Special' },
  { key:'birthday',     icon:'🎂', label:'Birthday' },
  { key:'conversation', icon:'💬', label:'Conversation' },
  { key:'photo',        icon:'📸', label:'Photo' },
  { key:'song',         icon:'🎵', label:'Song' },
  { key:'difficult',    icon:'💔', label:'Difficult Day' },
  { key:'story',        icon:'📖', label:'Story' },
  { key:'other',        icon:'⭐', label:'Other' },
];
const iconFor = key => (TYPES.find(t=>t.key===key)||{}).icon || '⭐';

// filter chips shown at the top (per the plan: ALL + a handful of the common ones)
const FILTER_KEYS = ['love','special','difficult','birthday','photo','song'];

// ---- birthdays ----
// ⚠️ Birth years pulled from the notes had a mismatch in a couple of spots —
// using the most recently stated values here. Worth double-checking these.
const BIRTHDAYS = [
  { who:'HER', label:'Her Birthday', month:11, day:29, year:2007 },
  { who:'ME',  label:'My Birthday',  month:3,  day:27, year:2006 },
];

const MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

let allMemories = [];      // rows from supabase, each with .types (array)
let activeFilter = 'ALL';
let searchTerm = '';
let selectedDateKey = null;
let view = (() => {
  const n = new Date();
  return { year: n.getFullYear(), month: n.getMonth() }; // month is 0-indexed
})();

const grid = document.getElementById('grid');
const monthTitle = document.getElementById('monthTitle');
const yearDivider = document.getElementById('yearDivider');
const detailWrap = document.getElementById('detailWrap');
const statusLine = document.getElementById('statusLine');
const filtersEl = document.getElementById('filters');
const statTotal = document.getElementById('statTotal');
const statBreakdown = document.getElementById('statBreakdown');
const bdayGrid = document.getElementById('bdayGrid');
const countdownBox = document.getElementById('countdownBox');

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

// ---- load from supabase ----
async function loadMemories(){
  const { data, error } = await supabase
    .from('calendar_memories')
    .select('id, memory_date, types, title, description')
    .order('memory_date', { ascending: true });

  if(error){
    statusLine.textContent = 'could not load the calendar — check connection.';
    allMemories = [];
  } else {
    allMemories = (data||[]).map(r => ({
      ...r,
      types: (r.types||'other').split(',').map(s=>s.trim()).filter(Boolean)
    }));
    statusLine.textContent = 'a private archive of us — kept exactly as it happened.';
  }
  renderFilters();
  renderStats();
  renderCalendar();
}

// ---- filters ----
function renderFilters(){
  filtersEl.innerHTML = '';
  const mk = (label, key) => {
    const b = document.createElement('button');
    b.className = 'filter-chip' + (activeFilter===key ? ' active':'');
    b.textContent = label;
    b.onclick = () => { activeFilter = key; renderFilters(); renderCalendar(); };
    return b;
  };
  filtersEl.appendChild(mk('ALL','ALL'));
  FILTER_KEYS.forEach(k => filtersEl.appendChild(mk(iconFor(k), k)));
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderCalendar();
});

// ---- matching helper ----
function matches(mem){
  if(activeFilter !== 'ALL' && !mem.types.includes(activeFilter)) return false;
  if(searchTerm){
    const hay = (mem.title + ' ' + (mem.description||'')).toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

// ---- build a map of date -> memories (including virtual recurring birthdays) ----
function memoriesForYear(year){
  const map = {};
  allMemories.forEach(m => {
    const key = m.memory_date; // already YYYY-MM-DD
    if(!map[key]) map[key] = [];
    map[key].push(m);
  });
  BIRTHDAYS.forEach(b => {
    const key = dateKey(year, b.month-1, b.day);
    if(!map[key]) map[key] = [];
    map[key].push({ id:'bday-'+b.who, memory_date:key, types:['birthday'], title:b.label, description:`Born ${b.year}.`, virtual:true });
  });
  return map;
}

// ---- calendar rendering ----
function renderCalendar(){
  const { year, month } = view;
  monthTitle.textContent = `${MONTH_NAMES[month]} ${year}`;
  yearDivider.textContent = year===2025 ? '2025 — WHERE IT ALL BEGAN' : (year===2026 ? '2026 — EVERYTHING CHANGED' : '');

  const map = memoriesForYear(year);
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  grid.innerHTML = '';

  for(let i=0;i<startOffset;i++){
    const el = document.createElement('div');
    el.className = 'day pad';
    grid.appendChild(el);
  }

  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(year, month, d);
    const dayMemories = (map[key]||[]);
    const visible = dayMemories.filter(matches);
    const isFiltering = activeFilter !== 'ALL' || !!searchTerm;

    const el = document.createElement('div');
    el.className = 'day';
    if(key === todayKey) el.classList.add('today');
    if(dayMemories.length){
      el.classList.add('has-memory');
      if(isFiltering && visible.length===0) el.classList.add('dimmed');
    }
    if(key === selectedDateKey) el.classList.add('selected');

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    el.appendChild(num);

    if(dayMemories.length){
      const marks = document.createElement('span');
      marks.className = 'marks';
      const iconSet = [...new Set(dayMemories.flatMap(m=>m.types))].slice(0,2).map(iconFor);
      marks.textContent = iconSet.join('');
      el.appendChild(marks);
      el.onclick = () => { selectedDateKey = key; renderCalendar(); renderDetail(key, dayMemories); };
    }
    grid.appendChild(el);
  }

  if(selectedDateKey){
    const y = parseInt(selectedDateKey.slice(0,4));
    if(y === year){
      const m = memoriesForYear(year)[selectedDateKey];
      if(m) renderDetail(selectedDateKey, m);
    }
  }
}

// ---- detail card(s) ----
function renderDetail(key, memories){
  detailWrap.innerHTML = '';
  const d = new Date(key + 'T00:00:00');
  const label = `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;

  memories.forEach(mem => {
    const card = document.createElement('div');
    card.className = 'detail-card';

    const icons = mem.types.map(iconFor).join(' ');
    card.innerHTML = `
      <div class="detail-date">${icons} ${label}</div>
      <div class="detail-title">${escapeHtml(mem.title.toUpperCase())}</div>
    `;

    if(mem.description){
      const desc = document.createElement('div');
      desc.className = 'detail-desc';
      desc.style.display = 'none';
      desc.textContent = mem.description;
      const toggle = document.createElement('button');
      toggle.className = 'detail-toggle';
      toggle.textContent = 'OPEN MEMORY →';
      toggle.onclick = () => {
        const open = desc.style.display !== 'none';
        desc.style.display = open ? 'none' : 'block';
        toggle.textContent = open ? 'OPEN MEMORY →' : 'CLOSE';
      };
      card.appendChild(toggle);
      card.appendChild(desc);
    } else {
      const desc = document.createElement('div');
      desc.className = 'detail-desc';
      desc.textContent = 'No further details added yet.';
      card.appendChild(desc);
    }
    detailWrap.appendChild(card);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- month nav ----
document.getElementById('prevMonth').onclick = () => {
  view.month--;
  if(view.month<0){ view.month=11; view.year--; }
  renderCalendar();
};
document.getElementById('nextMonth').onclick = () => {
  view.month++;
  if(view.month>11){ view.month=0; view.year++; }
  renderCalendar();
};

// ---- stats ----
function renderStats(){
  statTotal.textContent = allMemories.length;
  const counts = {};
  allMemories.forEach(m => m.types.forEach(t => counts[t] = (counts[t]||0)+1));
  statBreakdown.innerHTML = FILTER_KEYS
    .filter(k => counts[k])
    .map(k => `${iconFor(k)} <b>${counts[k]}</b>`)
    .join('&nbsp;&nbsp;&nbsp;');
}

// ---- birthdays + countdown ----
function renderBirthdays(){
  bdayGrid.innerHTML = '';
  BIRTHDAYS.forEach(b => {
    const el = document.createElement('div');
    el.className = 'bday-card';
    el.innerHTML = `
      <div class="icon">🎂</div>
      <div class="date">${b.day} ${MONTH_NAMES[b.month-1]}</div>
      <div class="who">${b.label.toUpperCase()}</div>
      <div class="born">Born • ${b.year}</div>
    `;
    bdayGrid.appendChild(el);
  });

  // next upcoming birthday
  const now = new Date(); now.setHours(0,0,0,0);
  let next = null, nextDiff = Infinity;
  BIRTHDAYS.forEach(b => {
    let cand = new Date(now.getFullYear(), b.month-1, b.day);
    if(cand < now) cand = new Date(now.getFullYear()+1, b.month-1, b.day);
    const diff = Math.round((cand-now)/86400000);
    if(diff < nextDiff){ nextDiff = diff; next = b; }
  });
  if(next){
    countdownBox.innerHTML = diffIsToday(nextDiff) ? `
      <div class="who">${next.label.toUpperCase()}</div>
      <div class="date">${next.day} ${MONTH_NAMES[next.month-1]}</div>
      <div class="days" style="font-size:1.1rem;">COMPLETED ❤️</div>
      <div class="days-label">MEMORY SAVED</div>
    ` : `
      <div class="who">NEXT BIRTHDAY — ${next.label.toUpperCase()}</div>
      <div class="date">${next.day} ${MONTH_NAMES[next.month-1]}</div>
      <div class="days">${nextDiff}</div>
      <div class="days-label">DAYS TO GO</div>
    `;
  }
}
function diffIsToday(d){ return d===0 || d===365 || d===366; }

// ---- add memory sheet ----
const sheetPanel = document.getElementById('sheetPanel');
const typeGrid = document.getElementById('typeGrid');
let selectedTypes = [];

TYPES.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'type-toggle';
  b.textContent = `${t.icon} ${t.label}`;
  b.onclick = () => {
    const idx = selectedTypes.indexOf(t.key);
    if(idx>-1){ selectedTypes.splice(idx,1); }
    else if(selectedTypes.length<2){ selectedTypes.push(t.key); }
    document.querySelectorAll('.type-toggle').forEach(el=>el.classList.remove('selected'));
    [...typeGrid.children].forEach((el,i) => { if(selectedTypes.includes(TYPES[i].key)) el.classList.add('selected'); });
  };
  typeGrid.appendChild(b);
});

document.getElementById('addBtn').onclick = () => sheetPanel.classList.add('open');
document.getElementById('fCancel').onclick = () => closeSheet();
sheetPanel.addEventListener('click', e => { if(e.target===sheetPanel) closeSheet(); });
function closeSheet(){
  sheetPanel.classList.remove('open');
  document.getElementById('fDate').value = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('formMsg').textContent = '';
  selectedTypes = [];
  [...typeGrid.children].forEach(el=>el.classList.remove('selected'));
}

document.getElementById('fSubmit').onclick = async () => {
  const dateVal = document.getElementById('fDate').value;
  const title = document.getElementById('fTitle').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const msg = document.getElementById('formMsg');

  if(!dateVal || !title || selectedTypes.length===0){
    msg.textContent = 'pick a date, at least one type, and a title.';
    return;
  }

  const btn = document.getElementById('fSubmit');
  btn.disabled = true;
  msg.textContent = 'saving…';

  const { error } = await supabase.from('calendar_memories').insert({
    memory_date: dateVal,
    types: selectedTypes.join(','),
    title,
    description: desc || null
  });

  btn.disabled = false;
  if(error){
    msg.textContent = 'could not save — try again.';
    return;
  }
  msg.textContent = '✓ added';
  setTimeout(() => {
    closeSheet();
    view.year = parseInt(dateVal.slice(0,4));
    view.month = parseInt(dateVal.slice(5,7)) - 1;
    selectedDateKey = dateVal;
    loadMemories();
  }, 500);
};

// ---- init ----
renderBirthdays();
loadMemories();
</script>
