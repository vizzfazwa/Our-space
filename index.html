/* LOGIN */
#loginScr{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.lbox{background:rgba(10,0,30,0.93);border:1px solid rgba(192,132,252,0.35);border-radius:26px;padding:32px 24px;width:100%;max-width:330px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(100,0,200,0.4);animation:popIn .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ltitle{font-family:"Dancing Script",cursive;font-size:2rem;background:linear-gradient(135deg,#e9d5ff,#c084fc,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.lsub{font-size:.78rem;color:rgba(192,132,252,.55);margin-bottom:20px;letter-spacing:1px;}
.user-cards{display:flex;gap:14px;justify-content:center;margin-bottom:4px;}
.ucard{flex:1;padding:14px 8px;border-radius:18px;border:2px solid transparent;cursor:pointer;transition:all .3s;text-align:center;}
.ucard.fc{background:linear-gradient(135deg,rgba(155,28,46,.3),rgba(225,29,72,.2));border-color:rgba(225,29,72,.4);}
.ucard.vc{background:linear-gradient(135deg,rgba(91,33,182,.3),rgba(168,85,247,.2));border-color:rgba(168,85,247,.4);}
.ucard-icon{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;}
.ucard.fc .ucard-icon{background:linear-gradient(135deg,#9b1c2e,#e11d48);}
.ucard-name{font-size:.82rem;font-weight:700;}
.ucard.fc .ucard-name{color:#fb7185;}
.ucard.vc .ucard-name{color:#c084fc;}
.ucard-sub{font-size:.62rem;opacity:.6;margin-top:2px;}
.pass-wrap{display:none;margin-top:4px;}
.pass-in{width:100%;padding:11px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(192,132,252,.3);border-radius:12px;color:#e9d5ff;font-family:"Quicksand",sans-serif;font-size:.9rem;margin-bottom:9px;outline:none;transition:border-color .3s;}
.pass-in:focus{border-color:#a855f7;}
.pass-in::placeholder{color:rgba(192,132,252,.35);}
.err{color:#f87171;font-size:.75rem;margin-bottom:7px;display:none;}
.enter-btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:"Quicksand",sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-bottom:7px;transition:all .3s;}
.ef{background:linear-gradient(135deg,#9b1c2e,#e11d48);color:white;}
.ev{background:linear-gradient(135deg,#5b21b6,#7c3aed,#c084fc);color:white;}
.back-btn{background:rgba(255,255,255,.05);border:1px solid rgba(192,132,252,.2);color:#c084fc;width:100%;padding:9px;border-radius:11px;font-family:"Quicksand",sans-serif;cursor:pointer;font-size:.82rem;}

/* CHAT */
#chatScr{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;}

/* HEADER */
.hdr{position:relative;z-index:10;padding:10px 14px;background:rgba(8,0,25,.92);border-bottom:1px solid rgba(192,132,252,.15);backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;}
.h-av-v{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:2px solid rgba(192,132,252,.45);background:rgba(168,85,247,.12);cursor:pointer;flex-shrink:0;transition:transform .2s;}
.h-av-f{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(225,29,72,.5);background:linear-gradient(135deg,#9b1c2e,#e11d48);cursor:pointer;flex-shrink:0;transition:transform .2s;}
.h-av-v:active,.h-av-f:active{transform:scale(.85);}
.h-info{flex:1;min-width:0;}
.h-name{font-family:"Dancing Script",cursive;font-size:1.15rem;}
.h-name.fn{color:#fb7185;}
.h-name.vn{color:#c084fc;}
.h-status{font-size:.62rem;letter-spacing:.5px;margin-top:1px;}
.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:4px;animation:blink 1.5s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.hdr-right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.hdr-btn{background:rgba(255,255,255,.06);border:1px solid rgba(192,132,252,.2);color:#c084fc;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;}
.hdr-btn:hover{background:rgba(192,132,252,.15);}
.logout-btn{background:rgba(255,255,255,.05);border:1px solid rgba(192,132,252,.2);color:#c084fc;padding:4px 10px;border-radius:18px;font-size:.68rem;cursor:pointer;font-family:"Quicksand",sans-serif;}

/* MSGS */
#msgsArea{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 20px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:5;scroll-behavior:smooth;}
#msgsArea::-webkit-scrollbar{width:3px;}
#msgsArea::-webkit-scrollbar-thumb{background:#7c3aed;border-radius:2px;}
.msg-wrap{display:flex;align-items:flex-end;gap:6px;animation:msgIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes msgIn{from{transform:scale(.7) translateY(15px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.msg-wrap.mine{flex-direction:row-reverse;}
.m-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.m-av.fa{background:linear-gradient(135deg,#9b1c2e,#e11d48);font-size:.85rem;}
.bubble-wrap{max-width:75%;display:flex;flex-direction:column;position:relative;}
.bubble{padding:9px 13px;border-radius:18px;font-size:.87rem;line-height:1.5;word-break:break-word;cursor:pointer;}
.sticker-bubble{font-size:3.2rem;line-height:1;cursor:pointer;background:transparent;padding:2px;}
.bubble.mine.fb{background:linear-gradient(135deg,#9b1c2e,#e11d48);color:white;border-bottom-right-radius:4px;box-shadow:0 4px 13px rgba(225,29,72,.35);}
.bubble.mine.vb{background:linear-gradient(135deg,#5b21b6,#7c3aed,#c084fc);color:white;border-bottom-right-radius:4px;box-shadow:0 4px 13px rgba(124,58,237,.35);}
.bubble.theirs{background:linear-gradient(135deg,rgba(18,0,45,.92),rgba(109,28,209,.2));border:1px solid rgba(192,132,252,.2);color:#e9d5ff;border-bottom-left-radius:4px;}
.msg-meta{font-size:.63rem;color:rgba(255,255,255,.5);margin-top:3px;display:flex;align-items:center;gap:4px;}
.msg-wrap.mine .msg-meta{justify-content:flex-end;}
.seen-tick{font-size:.65rem;color:white;}
.date-div{text-align:center;font-size:.68rem;color:rgba(192,132,252,.45);padding:3px 11px;background:rgba(10,0,30,.55);border-radius:18px;align-self:center;border:1px solid rgba(192,132,252,.12);}
.empty-s{text-align:center;padding:50px 20px;font-family:"Dancing Script",cursive;color:rgba(192,132,252,.3);font-size:1.2rem;}
.reply-preview{background:rgba(168,85,247,.15);border-left:3px solid #a855f7;padding:5px 8px;border-radius:6px;margin-bottom:5px;font-size:.72rem;color:#c084fc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-reaction{position:absolute;bottom:-12px;font-size:.82rem;background:rgba(10,0,30,.9);border-radius:10px;padding:1px 5px;border:1px solid rgba(192,132,252,.25);z-index:2;}
.msg-wrap.mine .bubble-wrap .msg-reaction{left:2px;}
.msg-wrap:not(.mine) .bubble-wrap .msg-reaction{right:2px;}

/* REPLY BAR */
.reply-bar{display:none;padding:7px 14px;background:rgba(8,0,25,.95);border-top:1px solid rgba(192,132,252,.15);align-items:center;gap:8px;}
.reply-bar.show{display:flex;}
.reply-bar-txt{flex:1;font-size:.76rem;color:#c084fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-close{background:none;border:none;color:#c084fc;font-size:1.1rem;cursor:pointer;padding:0 4px;}

/* VOICE BUBBLE */
.voice-bubble{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;min-width:200px;}
.voice-bubble.mine.fb{background:linear-gradient(135deg,#9b1c2e,#e11d48);border-bottom-right-radius:4px;box-shadow:0 4px 13px rgba(225,29,72,.35);}
.voice-bubble.mine.vb{background:linear-gradient(135deg,#5b21b6,#7c3aed);border-bottom-right-radius:4px;box-shadow:0 4px 13px rgba(124,58,237,.35);}
.voice-bubble.theirs{background:linear-gradient(135deg,rgba(18,0,45,.92),rgba(109,28,209,.3));border:1px solid rgba(192,132,252,.2);border-bottom-left-radius:4px;}
.vplay-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:white;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vwave{flex:1;height:26px;display:flex;align-items:center;gap:2px;}
.vbar{width:3px;background:rgba(255,255,255,.3);border-radius:2px;height:5px;transition:height .08s;}
.vbar.active{background:rgba(255,255,255,.9);}
.vdur{font-size:.68rem;color:rgba(255,255,255,.9);flex-shrink:0;font-weight:700;min-width:68px;text-align:right;}

/* IMAGE BUBBLE */
.img-bubble-wrap{padding:4px;border-radius:18px;cursor:pointer;overflow:hidden;}
.img-bubble-wrap img{max-width:200px;max-height:200px;border-radius:14px;display:block;object-fit:cover;}

/* FULLSCREEN IMAGE */
#imgFullscreen{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;}
#imgFullscreen.show{display:flex;}
#imgFullscreen img{max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain;}
#imgFsClose{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:white;width:38px;height:38px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* INPUT */
.inp-area{position:relative;z-index:10;padding:8px 10px;background:rgba(8,0,25,.95);border-top:1px solid rgba(192,132,252,.15);backdrop-filter:blur(20px);}
.inp-row{display:flex;gap:7px;align-items:center;}
.emoji-self-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(192,132,252,.25);background:rgba(255,255,255,.05);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s;}
.msg-in{flex:1;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(192,132,252,.25);border-radius:22px;color:#e9d5ff;font-family:"Quicksand",sans-serif;font-size:.87rem;outline:none;transition:all .3s;}
.msg-in:focus{border-color:#a855f7;box-shadow:0 0 12px rgba(168,85,247,.3);}
.msg-in::placeholder{color:rgba(192,132,252,.35);}
.mic-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(192,132,252,.25);background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:7px;transition:all .3s;font-size:1.3rem;}
.mic-btn.recording{border-color:#e11d48;background:rgba(225,29,72,.2);animation:recPulse 1s ease infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.4);}50%{box-shadow:0 0 0 8px rgba(225,29,72,0);}}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 13px rgba(124,58,237,.5);transition:all .3s;flex-shrink:0;}
.send-btn:active{transform:scale(.92);}
.rec-status{text-align:center;font-size:.75rem;color:#e11d48;padding:3px 0;display:none;}
.rec-status.show{display:block;}

/* LOVE ARROW */
.love-arrow{position:fixed;font-size:1.6rem;z-index:200;pointer-events:none;transition:all .85s cubic-bezier(.34,1.56,.64,1);}

/* PROFILE TAB */
#profileTab{position:fixed;inset:0;z-index:150;display:none;align-items:flex-end;justify-content:center;}
#profileTab.show{display:flex;}
.pt-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
.pt-box{position:relative;z-index:1;background:rgba(10,0,30,.97);border:1px solid rgba(192,132,252,.3);border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:20px 16px 36px;max-height:88vh;overflow-y:auto;overflow-x:hidden;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.pt-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:none;color:#c084fc;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.pt-head{text-align:center;margin-bottom:14px;}
.pt-emoji-big{font-size:3.5rem;display:block;margin-bottom:6px;}
.pt-name{font-family:"Dancing Script",cursive;font-size:1.7rem;color:#c084fc;}

/* COUNTS - 2 col, vertical list style */
.pt-counts{display:flex;flex-direction:column;gap:0;margin:14px 0;}
.pt-count-section{margin-bottom:10px;}
.pt-count-section-title{font-size:.68rem;color:rgba(192,132,252,.5);letter-spacing:1px;margin-bottom:6px;padding-left:2px;}
.pt-count-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.pt-count-box{text-align:center;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);border-radius:12px;padding:8px 4px;}
.pt-count-num{font-size:1.1rem;font-weight:700;color:#c084fc;}
.pt-count-lbl{font-size:.58rem;color:rgba(192,132,252,.6);margin-top:2px;}

.pt-media-title{font-size:.72rem;color:rgba(192,132,252,.5);margin:12px 0 8px;letter-spacing:1px;}
.pt-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.pt-media-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(192,132,252,.15);cursor:pointer;}

/* PLUS TAB - centered */
#plusTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#plusTab.show{display:flex;}
.plus-box{background:rgba(10,0,30,.97);border:1px solid rgba(192,132,252,.35);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(100,0,200,.6);min-width:180px;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);}
.react-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(192,132,252,.2);border-radius:12px;padding:10px 14px;cursor:pointer;transition:all .2s;color:#e9d5ff;font-family:"Quicksand",sans-serif;font-size:.85rem;font-weight:600;width:100%;}
.react-btn:hover,.react-btn:active{background:rgba(168,85,247,.25);}
.react-btn .r-ico{font-size:1.4rem;}

/* CLEAR CHAT TAB - centered, reuses plus-box/react-btn look */
#clearChatTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#clearChatTab.show{display:flex;}
#colorTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#colorTab.show{display:flex;}
#stickerTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#stickerTab.show{display:flex;}
#addStatusTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#addStatusTab.show{display:flex;}
#bgTab{position:fixed;z-index:160;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#bgTab.show{display:flex;}
.bg-thumb{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;cursor:pointer;border:2px solid rgba(192,132,252,.25);transition:all .2s;}
.bg-thumb:active{transform:scale(0.93);}
.bg-thumb.selected{border-color:#c084fc;box-shadow:0 0 12px rgba(192,132,252,.7);}
.bg-none-btn{width:100%;aspect-ratio:1;border-radius:12px;border:2px dashed rgba(192,132,252,.3);background:rgba(255,255,255,.03);color:rgba(192,132,252,.5);font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;}

/* MSG REACTION PICKER */
#msgReactPicker{position:fixed;z-index:170;display:none;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);}
#msgReactPicker.show{display:flex;}
.emoji-pick-row{background:rgba(10,0,30,.97);border:1px solid rgba(192,132,252,.35);border-radius:22px;padding:14px 12px;display:flex;gap:8px;box-shadow:0 12px 40px rgba(100,0,200,.6);animation:popIn .25s cubic-bezier(.34,1.56,.64,1);}
.emoji-pick-btn{background:rgba(255,255,255,.05);border:1px solid rgba(192,132,252,.2);border-radius:12px;font-size:1.5rem;padding:8px 10px;cursor:pointer;transition:all .2s;}
.emoji-pick-btn:hover,.emoji-pick-btn:active{background:rgba(168,85,247,.3);transform:scale(1.15);}
.react-btn.danger{border-color:rgba(225,29,72,.35);}
.react-btn.danger:hover,.react-btn.danger:active{background:rgba(225,29,72,.25);}

/* TWO-CARD LAYOUT for teddy/princess tap */
.two-card-row{display:flex;gap:10px;align-items:flex-start;}
.mood-box{background:rgba(10,0,30,.97);border:1px solid rgba(192,132,252,.35);border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 12px 40px rgba(100,0,200,.6);min-width:200px;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.05);border:1px solid rgba(192,132,252,.2);border-radius:12px;padding:9px 6px;cursor:pointer;transition:all .2s;color:#e9d5ff;font-family:"Quicksand",sans-serif;font-size:.62rem;font-weight:600;text-align:center;}
.mood-btn:hover,.mood-btn:active{background:rgba(168,85,247,.25);}
.mood-btn .m-ico{font-size:1.3rem;}
.mood-card-label{grid-column:span 2;font-size:.6rem;color:rgba(192,132,252,.5);text-align:center;letter-spacing:1px;margin-bottom:2px;}

/* STATUS BADGE above self emoji */
.self-emoji-wrap{position:relative;display:inline-block;}
.status-badge{position:absolute;top:-14px;right:-6px;background:rgba(10,0,30,.95);border:1px solid rgba(192,132,252,.4);border-radius:10px;font-size:.75rem;padding:1px 4px;display:none;box-shadow:0 3px 10px rgba(100,0,200,.5);}
.status-badge.show{display:block;}

/* ACTIVITY STATUS BAR under header */
#activityBar{font-size:.65rem;color:rgba(192,132,252,.65);text-align:center;padding:4px 10px;letter-spacing:.4px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease;background:rgba(10,0,30,.4);}
#activityBar.show{max-height:24px;padding:5px 10px;}

/* REACTION OVERLAY */
#reactionOverlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;pointer-events:none;}
#reactionOverlay.show{display:flex;}
.reaction-center{text-align:center;animation:reactionPop 2.5s forwards;}
@keyframes reactionPop{0%{transform:scale(0);opacity:0;}20%{transform:scale(1.3);opacity:1;}80%{transform:scale(1);opacity:1;}100%{transform:scale(.5);opacity:0;}}
.reaction-emoji-big{font-size:5rem;display:block;}
.reaction-text{font-family:"Dancing Script",cursive;font-size:1.3rem;color:#e9d5ff;margin-top:8px;}

/* TYPING */
.typing-indicator{display:flex;align-items:center;gap:5px;padding:8px 12px;}
.typing-dot{width:7px;height:7px;border-radius:50%;background:#a855f7;animation:typB 1.2s ease infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typB{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}

/* POPPERS */
.popper{position:fixed;font-size:1.5rem;pointer-events:none;z-index:310;animation:popperFly 1.5s forwards;}
@keyframes popperFly{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-200px) scale(.3) rotate(720deg);opacity:0;}}
</style>

// STARS
const cv=document.getElementById('sc'),cx=cv.getContext('2d');
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}rsz();window.addEventListener('resize',rsz);
const stars=Array.from({length:100},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+.3,a:Math.random(),sp:.004+Math.random()*.008}));
(function tick(){cx.clearRect(0,0,cv.width,cv.height);stars.forEach(s=>{s.a+=s.sp;cx.fillStyle=`rgba(233,213,255,${.15+Math.sin(s.a)*.3})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();});requestAnimationFrame(tick);})();

// API
async function api(method,path,body){
  const r=await fetch(SB+'/rest/v1/'+path,{method,headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=minimal':''},body:body?JSON.stringify(body):undefined});
  if(method==='GET')return r.json();return r;
}
// BACKGROUND
function toggleBgTab(){
  const tab=document.getElementById('bgTab');
  if(tab.classList.contains('show')){tab.classList.remove('show');return;}
  renderBgGrid();
  tab.classList.add('show');
}
function renderBgGrid(){
  const grid=document.getElementById('bgGrid');
  grid.innerHTML='';
  const noneBtn=document.createElement('button');
  noneBtn.className='bg-none-btn';noneBtn.textContent='✕ None';
  noneBtn.onclick=()=>setBackground('none');
  grid.appendChild(noneBtn);
  BACKGROUNDS.forEach(bg=>{
    const im=document.createElement('img');
    im.className='bg-thumb'+(myBg===bg.id?' selected':'');
    im.src=bg.url;
    im.onclick=()=>setBackground(bg.id);
    grid.appendChild(im);
  });
}
function applyBackground(){
  const chatArea=document.getElementById('msgsArea');
  if(!chatArea)return;
  if(myBg==='none'){chatArea.style.backgroundImage='';return;}
  if(myBg){
    const bg=BACKGROUNDS.find(b=>b.id===myBg);
    if(bg){chatArea.style.backgroundImage=`linear-gradient(rgba(10,0,30,.55),rgba(10,0,30,.55)),url('${bg.url}')`;chatArea.style.backgroundSize='cover';chatArea.style.backgroundPosition='center';return;}
  }
  // auto daily rotating theme (day1->bg1 ... day8->bg8, loops)
  const dayIdx=Math.floor(Date.now()/86400000)%BACKGROUNDS.length;
  const dayBg=BACKGROUNDS[dayIdx];
  if(dayBg){chatArea.style.backgroundImage=`linear-gradient(rgba(10,0,30,.55),rgba(10,0,30,.55)),url('${dayBg.url}')`;chatArea.style.backgroundSize='cover';chatArea.style.backgroundPosition='center';return;}
  chatArea.style.backgroundImage='';
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:#c084fc;text-decoration:underline;">$1</a>');}

async function sendVideo(e){
  const file=e.target.files[0];if(!file)return;
  const MAX_MB=25;
  if(file.size>MAX_MB*1024*1024){
    alert(`Video too big! Max ${MAX_MB}MB (yours: ${(file.size/1024/1024).toFixed(1)}MB). Try a shorter clip 💜`);
    e.target.value='';return;
  }
  try{
    setActivity('Sending video...');
    const url=await uploadToStorage(file,'videos','mp4');
    await api('POST','messages',{sender:me,content:'__VIDEO__'+url,seen:false});
    await loadMsgs();
    setActivity('Video sent 💜',1200);
  }catch(err){console.log('video upload err',err);setActivity('Video failed 😢',1500);}
  e.target.value='';
}

// STORAGE UPLOAD (bandwidth-friendly: only a small URL goes in the DB)
async function uploadToStorage(blob,folder,ext){
  const fileName=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const res=await fetch(`${SB}/storage/v1/object/chat-media/${fileName}`,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':blob.type||'application/octet-stream'},
    body:blob
  });
  if(!res.ok)throw new Error('upload failed: '+res.status);
  return `${SB}/storage/v1/object/public/chat-media/${fileName}`;
}

// LOAD MSGS
async function loadMsgs(){
  if(!me)return;
  try{
    const data=await api('GET','messages?select=*&order=created_at.asc&limit=500');
    if(!Array.isArray(data))return;
    const area=document.getElementById('msgsArea');
    const empty=document.getElementById('emptyS');
    if(data.length>0&&empty)empty.remove();
    const other=me==='fawaz'?'pathumma':'fawaz';
    data.filter(m=>m.sender===other&&!m.seen).forEach(async m=>await api('PATCH',`messages?id=eq.${m.id}`,{seen:true,seen_at:new Date().toISOString()}));

    let msgReactions={};
    try{
      const mr=await api('GET','msg_reactions?select=*');
      if(Array.isArray(mr))mr.forEach(r=>{if(!msgReactions[r.msg_id])msgReactions[r.msg_id]=[];msgReactions[r.msg_id].push(r);});
    }catch(e){}

    let scrollNeeded=false;
    data.forEach(msg=>{
      if(rendered.has(msg.id)){
        const tick=document.querySelector(`[data-mid="${msg.id}"] .seen-tick`);
        if(tick&&msg.sender===me)tick.textContent=msg.seen?'✓✓':'✓';
        const rList=msgReactions[msg.id]||[];
        const bw=document.querySelector(`[data-mid="${msg.id}"] .bubble-wrap`);
        if(bw){
          let rb=bw.querySelector('.msg-reaction');
          if(rList.length>0){
            const g={};rList.forEach(r=>{g[r.emoji]=(g[r.emoji]||0)+1;});
            const html=Object.entries(g).map(([e,c])=>`${e}${c>1?'<small style="font-size:.58rem;">'+c+'</small>':''}`).join('');
            if(!rb){rb=document.createElement('div');rb.className='msg-reaction';bw.appendChild(rb);}
            rb.innerHTML=html;
          }
        }
        return;
      }
      rendered.add(msg.id);scrollNeeded=true;
      maybeNotify(msg);
      const d=new Date(msg.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
      if(d!==lastDate){lastDate=d;const dv=document.createElement('div');dv.className='date-div';dv.textContent='✦ '+d+' ✦';area.appendChild(dv);}
      const isMine=msg.sender===me;
      const wrap=document.createElement('div');
      wrap.className='msg-wrap '+(isMine?'mine':'theirs');
      wrap.setAttribute('data-mid',msg.id);
      const av=document.createElement('div');
      av.className='m-av'+(msg.sender==='fawaz'?' fa':'');
      av.textContent=EMO[msg.sender];
      const bw=document.createElement('div');bw.className='bubble-wrap';
      const bc=isMine?'mine '+(msg.sender==='fawaz'?'fb':'vb'):'theirs';
      if(msg.reply_to_content){
        const rp=document.createElement('div');rp.className='reply-preview';
        const rTxt=msg.reply_to_content.startsWith('__VOICE__')?'🎤 Voice':msg.reply_to_content.startsWith('__IMG__')?'📷 Photo':msg.reply_to_content.startsWith('__VIDEO__')?'🎥 Video':msg.reply_to_content.startsWith('__STICKER__')?'😀 Sticker':msg.reply_to_content;
        rp.textContent='↩ '+rTxt.substring(0,55);bw.appendChild(rp);
      }
      let bub;
      if(msg.content.startsWith('__VOICE__')){
        bub=createVoiceBubble(msg.content.replace('__VOICE__',''),bc);
      }else if(msg.content.startsWith('__IMG__')){
        const imgSrc=msg.content.replace('__IMG__','');
        bub=document.createElement('div');bub.className='img-bubble-wrap bubble '+bc;bub.style.padding='4px';
        const im=document.createElement('img');im.src=imgSrc;im.style.cssText='max-width:200px;max-height:200px;border-radius:14px;display:block;object-fit:cover;';
        im.onclick=()=>openFullscreen(imgSrc);
        bub.appendChild(im);
      }else if(msg.content.startsWith('__VIDEO__')){
        const vidSrc=msg.content.replace('__VIDEO__','');
        bub=document.createElement('div');bub.className='img-bubble-wrap bubble '+bc;bub.style.padding='4px';
        const vd=document.createElement('video');vd.src=vidSrc;vd.controls=true;vd.style.cssText='max-width:220px;max-height:260px;border-radius:14px;display:block;';
        bub.appendChild(vd);
      }else if(msg.content.startsWith('__STICKER__')){
        const emoji=msg.content.replace('__STICKER__','');
        bub=document.createElement('div');bub.className='sticker-bubble';bub.textContent=emoji;
      }else{
        bub=document.createElement('div');bub.className='bubble '+bc;
        bub.innerHTML=linkify(esc(msg.content));
      }

      // double tap = 🌸
      let tapCnt=0,tapTmr=null;
      bub.addEventListener('click',()=>{tapCnt++;if(tapCnt===1)tapTmr=setTimeout(()=>{tapCnt=0;},300);if(tapCnt>=2){clearTimeout(tapTmr);tapCnt=0;addMsgReaction(msg.id,'🌸');}});
      // long press = show 6-emoji reaction picker
      let pressT=null;
      bub.addEventListener('touchstart',()=>{pressT=setTimeout(()=>openMsgReactPicker(msg.id),500);},{passive:true});
      bub.addEventListener('touchend',()=>clearTimeout(pressT));

      const t=new Date(msg.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      const meta=document.createElement('div');meta.className='msg-meta';
      meta.innerHTML=`<span>${t}</span>`;
      if(isMine){
        const tick=document.createElement('span');tick.className='seen-tick';tick.textContent=msg.seen?'✓✓':'✓';
        if(msg.seen&&msg.seen_at){const st=new Date(msg.seen_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});tick.title=`Seen at ${st}`;}
        meta.appendChild(tick);
      }
      bw.appendChild(bub);bw.appendChild(meta);
      if(isMine&&msg.seen&&msg.seen_at){
        const seenLine=document.createElement('div');
        seenLine.style.cssText='font-size:.6rem;color:rgba(192,132,252,.45);text-align:right;margin-top:1px;';
        seenLine.textContent='Seen at '+new Date(msg.seen_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
        bw.appendChild(seenLine);
      }
      const rList=msgReactions[msg.id]||[];
      if(rList.length>0){
        const g={};rList.forEach(r=>{g[r.emoji]=(g[r.emoji]||0)+1;});
        const rb=document.createElement('div');rb.className='msg-reaction';
        rb.innerHTML=Object.entries(g).map(([e,c])=>`${e}${c>1?'<small style="font-size:.58rem;">'+c+'</small>':''}`).join('');
        bw.appendChild(rb);
      }
      if(isMine){wrap.appendChild(bw);wrap.appendChild(av);}else{wrap.appendChild(av);wrap.appendChild(bw);}
      area.appendChild(wrap);
    });
    if(scrollNeeded)area.scrollTop=area.scrollHeight;
    applyColors();
  }catch(e){console.log(e);}
}

// VOICE BUBBLE
function createVoiceBubble(dataUrl,bc){
  const div=document.createElement('div');div.className='voice-bubble '+bc;
  const pb=document.createElement('button');pb.className='vplay-btn';pb.textContent='▶';
  const audio=new Audio(dataUrl);
  const wave=document.createElement('div');wave.className='vwave';
  const bars=[];
  for(let i=0;i<12;i++){const b=document.createElement('div');b.className='vbar';wave.appendChild(b);bars.push(b);}
  const dur=document.createElement('span');dur.className='vdur';dur.textContent='0:00 / 0:00';
  let total=0;
  audio.addEventListener('loadedmetadata',()=>{total=audio.duration;dur.textContent='0:00 / '+fmt(total);});
  audio.addEventListener('timeupdate',()=>{
    const c=audio.currentTime;dur.textContent=fmt(c)+' / '+fmt(total);
    const pct=total>0?c/total:0;
    bars.forEach((b,i)=>{const a=i/bars.length<=pct;b.style.height=a?'18px':'5px';b.className='vbar'+(a?' active':'');});
  });
  audio.addEventListener('ended',()=>{pb.textContent='▶';dur.textContent='0:00 / '+fmt(total);bars.forEach(b=>{b.style.height='5px';b.className='vbar';});});
  pb.onclick=()=>{if(audio.paused){audio.play();pb.textContent='⏸';}else{audio.pause();pb.textContent='▶';}};
  div.appendChild(pb);div.appendChild(wave);div.appendChild(dur);return div;
}
function fmt(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

async function sendMsg(){
  const inp=document.getElementById('msgIn'),txt=inp.value.trim();if(!txt)return;
  inp.value='';
  const body={sender:me,content:txt,seen:false};
  if(replyTo){body.reply_to_id=replyTo.id;body.reply_to_content=replyTo.content.substring(0,100);}
  clearReply();shootArrow();
  setActivity('Sending message...');
  await api('POST','messages',body);await loadMsgs();
  setActivity('Sent 💜',1200);
}
function shootArrow(){
  const a=document.createElement('div');a.className='love-arrow';a.textContent='💘';
  const isF=me==='fawaz';
  a.style.cssText=`left:${isF?innerWidth-60:20}px;top:${innerHeight-75}px;`;
  document.body.appendChild(a);
  setTimeout(()=>{a.style.left=(isF?20:innerWidth-60)+'px';a.style.top='80px';a.style.transform='scale(1.6)';},30);
  setTimeout(()=>{a.style.transform='scale(2.2) rotate(20deg)';a.style.opacity='0';},850);
  setTimeout(()=>a.remove(),1200);
}

async function sendImage(e){
  const file=e.target.files[0];if(!file)return;
  try{
    setActivity('Sending photo...');
    const ext=(file.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const url=await uploadToStorage(file,'images',ext);
    await api('POST','messages',{sender:me,content:'__IMG__'+url,seen:false});
    await loadMsgs();
    setActivity('Photo sent 💜',1200);
  }catch(err){console.log('img upload err',err);setActivity('Photo failed 😢',1500);}
  e.target.value='';
}

// VOICE RECORD
async function toggleRecord(){
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioChunks=[];mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=e=>audioChunks.push(e.data);
      // live waveform
      const actx=new(window.AudioContext||window.webkitAudioContext)();
      const analyser=actx.createAnalyser();analyser.fftSize=64;
      const src=actx.createMediaStreamSource(stream);src.connect(analyser);
      const wavCv=document.getElementById('wavCanvas'),wavCx=wavCv.getContext('2d');
      const dataArr=new Uint8Array(analyser.frequencyBinCount);
      let wavRAF=null;
      function drawWave(){
        wavRAF=requestAnimationFrame(drawWave);
        analyser.getByteFrequencyData(dataArr);
        wavCx.clearRect(0,0,wavCv.width,wavCv.height);
        wavCx.fillStyle='#c084fc';
        const barW=wavCv.width/dataArr.length;
        for(let i=0;i<dataArr.length;i++){
          const h=(dataArr[i]/255)*wavCv.height;
          wavCx.fillRect(i*barW,wavCv.height-h,barW-1,h);
        }
      }
      drawWave();
      mediaRec.onstop=async()=>{
        cancelAnimationFrame(wavRAF);actx.close();
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        try{
          setActivity('Sending voice...');
          const url=await uploadToStorage(blob,'voice','webm');
          await api('POST','messages',{sender:me,content:'__VOICE__'+url,seen:false});
          await loadMsgs();
          setActivity('Voice sent 💜',1200);
        }catch(err){console.log('voice upload err',err);setActivity('Voice failed 😢',1500);}
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start();isRecording=true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('recStatus').classList.add('show');
      setActivity('🔴 Recording...');
    }catch(e){alert('Mic access needed!');}
  }else{
    mediaRec.stop();isRecording=false;
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('recStatus').classList.remove('show');
  }
}

async function sendReaction(type,emoji){
  document.getElementById('plusTab').classList.remove('show');
  try{await api('POST','reactions',{sender:me,type,created_at:new Date().toISOString()});}catch(e){}
  showReactionAnim(type,emoji,true);
}
async function checkNewReactions(){
  if(!me)return;
  try{
    const other=me==='fawaz'?'pathumma':'fawaz';
    const data=await api('GET',`reactions?select=*&sender=eq.${other}&order=created_at.desc&limit=1`);
    if(Array.isArray(data)&&data.length>0){
      const r=data[0];
      if(lastReactionId===0){lastReactionId=r.id;return;}
      if(r.id>lastReactionId){
        lastReactionId=r.id;
        const em={kiss:'💋',hug:'🫂',slap:'😤',miss:'💌'};
        const tx={kiss:'gave you a kiss 💋',hug:'gave you a hug 🫂',slap:'slapped you 😤',miss:'misses you 💌'};
        showReactionAnim(r.type,em[r.type]||'💜',false,`${NAMES[other].split(' ')[0]} ${tx[r.type]||'reacted'}!`);
      }
    }
  }catch(e){}
}
function showReactionAnim(type,emoji,isSender,customText){
  document.getElementById('reactionEmojiBig').textContent=emoji;
  const other=me==='fawaz'?'pathumma':'fawaz';
  const n=NAMES[other].split(' ')[0];
  document.getElementById('reactionText').textContent=isSender?{kiss:`You sent a kiss to ${n} 💋`,hug:`You hugged ${n} 🫂`,slap:`You slapped ${n} 😤`,miss:`You told ${n} you miss them 💌`}[type]||'':customText||'';
  const overlay=document.getElementById('reactionOverlay');overlay.classList.add('show');
  const center=document.getElementById('reactionCenter');center.style.animation='none';void center.offsetWidth;center.style.animation='reactionPop 2.5s forwards';
  spawnPoppers(emoji);setTimeout(()=>overlay.classList.remove('show'),2600);
}
function spawnPoppers(emoji){
  const pool=[emoji,'✨','💫','🌸','⭐'];
  for(let i=0;i<14;i++)setTimeout(()=>{
    const p=document.createElement('div');p.className='popper';
    p.textContent=pool[Math.floor(Math.random()*pool.length)];
    p.style.left=Math.random()*90+5+'vw';p.style.top=Math.random()*60+10+'vh';
    p.style.animationDuration=(1+Math.random()*.8)+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),2000);
  },i*80);
}

    const now=new Date();const[y,m,d]=md.split('-').map(Number);
    let next=new Date(now.getFullYear(),m-1,d);
    if(next<now)next=new Date(now.getFullYear()+1,m-1,d);
