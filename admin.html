<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a08; --ink-2:#151210; --paper:#f3ead6;
    --paper-dim:rgba(243,234,214,0.55); --paper-faint:rgba(243,234,214,0.16);
    --brass:#c9a227; --string:#a3182a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--ink);}
  body{color:var(--paper);font-family:'Space Mono',monospace;min-height:100vh;padding-bottom:60px;}

  /* ---- lock screen ---- */
  #lockScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
    padding:20px;gap:18px;
  }
  #lockScreen .icon{font-size:2.2rem;}
  #lockScreen h1{font-family:'Fraunces',serif;font-weight:900;font-size:1.2rem;letter-spacing:0.02em;}
  #lockScreen p{font-size:0.7rem;color:var(--paper-dim);letter-spacing:0.05em;}
  #passInput{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:1.4rem;letter-spacing:0.5em;
    text-align:center;padding:14px;width:220px;
  }
  #passInput:focus{outline:none;border-color:var(--brass);}
  #unlockBtn{
    background:var(--brass);color:var(--ink);border:none;font-weight:700;
    font-family:'Space Mono',monospace;font-size:0.8rem;letter-spacing:0.05em;
    padding:13px 32px;cursor:pointer;
  }
  #lockErr{font-size:0.72rem;color:var(--string);min-height:1em;}

  /* ---- dashboard ---- */
  #dashboard{display:none;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(10,9,8,0.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--paper-faint);padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .g-title{font-family:'Fraunces',serif;font-weight:900;font-size:1rem;}
  .lock-btn{background:none;border:none;color:var(--paper-dim);font-size:0.7rem;cursor:pointer;font-family:'Space Mono',monospace;}
  .lock-btn:hover{color:var(--brass);}

  main{max-width:640px;margin:0 auto;padding:18px 16px 0;}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .tab-btn{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.03em;
    padding:9px 12px;cursor:pointer;flex:1;min-width:100px;
  }
  .tab-btn.active{border-color:var(--brass);color:var(--brass);}

  .panel{display:none;}
  .panel.active{display:block;}

  .item-row{
    border:1px solid var(--paper-faint);padding:12px;margin-bottom:8px;
  }
  .item-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .item-meta{font-size:0.65rem;color:var(--paper-dim);letter-spacing:0.03em;}
  .item-main{font-size:0.82rem;margin-top:6px;line-height:1.5;word-break:break-word;}
  .item-thumb{max-width:100%;max-height:160px;margin-top:8px;display:block;object-fit:cover;}
  .item-actions{display:flex;gap:6px;margin-top:10px;}
  .item-actions button{
    font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.03em;
    padding:8px 10px;cursor:pointer;background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
  }
  .item-actions .danger:hover{border-color:var(--string);color:var(--string);}
  .item-actions button:hover{border-color:var(--brass);color:var(--brass);}
  .pin-tag{font-size:0.65rem;color:var(--brass);}

  .add-btn{
    display:block;width:100%;margin:14px 0 30px;
    background:transparent;border:1px dashed var(--paper-faint);color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.75rem;letter-spacing:0.04em;
    padding:13px;cursor:pointer;
  }
  .add-btn:hover{border-color:var(--brass);color:var(--brass);}
  .empty-note{color:var(--paper-dim);font-size:0.76rem;padding:20px 0;text-align:center;}

  /* ---- modal (edit / add) ---- */
  .modal-panel{
    position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.75);
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-panel.open{display:flex;}
  .modal{
    background:var(--ink-2);border-top:1px solid var(--paper-faint);
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:22px 20px 28px;animation:sheetUp 0.2s ease;
  }
  @keyframes sheetUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{font-family:'Fraunces',serif;font-weight:900;font-size:1.05rem;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.66rem;letter-spacing:0.06em;color:var(--paper-dim);margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%;background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:0.78rem;padding:10px;
  }
  .field textarea{resize:vertical;min-height:90px;}
  .field.checkline{display:flex;align-items:center;gap:8px;}
  .field.checkline input{width:16px;height:16px;}
  .modal-submit{
    width:100%;background:var(--brass);color:var(--ink);border:none;
    font-family:'Space Mono',monospace;font-weight:700;font-size:0.78rem;letter-spacing:0.04em;
    padding:13px;cursor:pointer;margin-top:4px;
  }
  .modal-submit:disabled{opacity:0.5;}
  .modal-cancel{
    width:100%;background:none;border:none;color:var(--paper-dim);
    font-family:'Space Mono',monospace;font-size:0.72rem;padding:10px;cursor:pointer;
  }
  .form-msg{font-size:0.7rem;color:var(--paper-dim);margin-top:8px;min-height:1em;}

  /* ---- confirm delete ---- */
  .confirm-panel{
    position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.75);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-panel.open{display:flex;}
  .confirm-box{background:var(--ink-2);border:1px solid var(--string);padding:22px 20px;max-width:340px;text-align:center;}
  .confirm-box p{font-size:0.8rem;margin-bottom:4px;}
  .confirm-box .sub{font-size:0.68rem;color:var(--paper-dim);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{
    flex:1;font-family:'Space Mono',monospace;font-size:0.72rem;padding:11px;cursor:pointer;
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper);
  }
  .confirm-actions .del-btn{border-color:var(--string);color:var(--string);}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="icon">🔐</div>
  <h1>PRIVATE AREA</h1>
  <p>Enter Admin Password</p>
  <input type="password" id="passInput" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" placeholder="••••••">
  <button id="unlockBtn">UNLOCK</button>
  <div id="lockErr"></div>
</div>

<div id="dashboard">
  <header class="topbar">
    <span class="g-title">🔐 MEMORY CONTROL</span>
    <button class="lock-btn" id="relockBtn">LOCK ↩</button>
  </header>

  <main>
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="messages">💬 MESSAGES</button>
      <button class="tab-btn" data-tab="gallery">🖼️ GALLERY</button>
      <button class="tab-btn" data-tab="calendar">🗓️ CALENDAR</button>
      <button class="tab-btn" data-tab="letters">✉️ LETTERS</button>
      <button class="tab-btn" data-tab="story">📖 STORY</button>
    </div>

    <div class="panel active" id="panel-messages"></div>
    <div class="panel" id="panel-gallery"></div>
    <div class="panel" id="panel-calendar"></div>
    <div class="panel" id="panel-letters"></div>
    <div class="panel" id="panel-story"></div>
  </main>
</div>

<!-- generic edit/add modal -->
<div class="modal-panel" id="modalPanel">
  <div class="modal">
    <h3 id="modalTitle">Edit</h3>
    <div id="modalFields"></div>
    <button class="modal-submit" id="modalSave">SAVE</button>
    <button class="modal-cancel" id="modalCancel">CANCEL</button>
    <div class="form-msg" id="modalMsg"></div>
  </div>
</div>

<!-- gallery upload modal -->
<div class="modal-panel" id="uploadModal">
  <div class="modal">
    <h3>＋ Upload Media</h3>
    <div class="field">
      <label>SELECT PHOTO</label>
      <input type="file" id="upPhoto" accept="image/*">
    </div>
    <div class="field">
      <label>OR SELECT VIDEO</label>
      <input type="file" id="upVideo" accept="video/*">
    </div>
    <div class="form-msg" id="uploadMsg"></div>
    <button class="modal-cancel" id="uploadCancel">CANCEL</button>
  </div>
</div>

<!-- confirm delete -->
<div class="confirm-panel" id="confirmPanel">
  <div class="confirm-box">
    <p>Delete this?</p>
    <div class="sub">This action cannot be undone.</div>
    <div class="confirm-actions">
      <button id="confirmCancel">CANCEL</button>
      <button class="del-btn" id="confirmDelete">DELETE</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const ADMIN_PASSWORD = '821915';

// two projects: gift-to-her (messages) and gallery (everything else)
const mainClient = createClient('https://qrtzkmbdjuubzegcuadu.supabase.co', 'sb_publishable_VtUutzytoRnAxrjy5NblhA_r_b2YQAB');
const galleryClient = createClient('https://yesfebylerfhofhybtdp.supabase.co', 'sb_publishable_8rlJJfAHpciqCHvA1VmLAA_uWzj-p4w');

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

// ---- lock screen ----
const lockScreen = document.getElementById('lockScreen');
const dashboard = document.getElementById('dashboard');
const passInput = document.getElementById('passInput');
const lockErr = document.getElementById('lockErr');

function unlock(){
  if(passInput.value === ADMIN_PASSWORD){
    sessionStorage.setItem('admin_unlocked','1');
    lockScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadTab('messages');
  } else {
    lockErr.textContent = 'Wrong password.';
    passInput.value = '';
  }
}
document.getElementById('unlockBtn').onclick = unlock;
passInput.addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
document.getElementById('relockBtn').onclick = () => {
  sessionStorage.removeItem('admin_unlocked');
  location.reload();
};
if(sessionStorage.getItem('admin_unlocked')==='1'){
  lockScreen.style.display='none'; dashboard.style.display='block'; loadTab('messages');
}

// ---- tabs ----
const loadedTabs = new Set();
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  loadTab(btn.dataset.tab);
});

function loadTab(tab){
  if(tab==='messages') loadMessages();
  else if(tab==='gallery') loadGallery();
  else if(tab==='calendar') loadCalendar();
  else if(tab==='letters') loadLetters();
  else if(tab==='story') loadStory();
}

// ============ MESSAGES ============
async function loadMessages(){
  const panel = document.getElementById('panel-messages');
  panel.innerHTML = '<div class="empty-note">loading…</div>';
  const { data, error } = await mainClient.from('messages_archive')
    .select('id, sender, text_reply, has_voice, media_url, media_type, media_name, created_at')
    .order('created_at', { ascending:false });
  if(error){ panel.innerHTML = `<div class="empty-note">could not load: ${escapeHtml(error.message)}</div>`; return; }
  if(!data || !data.length){ panel.innerHTML = '<div class="empty-note">No archived messages yet.</div>'; return; }

  panel.innerHTML = data.map(m => {
    let body = '';
    if(m.text_reply) body = `<div class="item-main">${escapeHtml(m.text_reply)}</div>`;
    else if(m.has_voice) body = `<div class="item-main">🎤 Voice message</div>`;
    else if(m.media_url) body = `<div class="item-main">${m.media_type==='video'?'🎥':'📷'} ${escapeHtml(m.media_name||'media')}</div>
      <img class="item-thumb" src="${m.media_type==='video'?'':m.media_url}" onerror="this.style.display='none'">`;
    const canEdit = !!m.text_reply;
    return `
    <div class="item-row" data-id="${m.id}">
      <div class="item-top">
        <span class="item-meta">${escapeHtml(m.sender||'')}</span>
        <span class="item-meta">${fmtDateTime(m.created_at)}</span>
      </div>
      ${body}
      <div class="item-actions">
        ${canEdit ? `<button data-action="edit-message" data-id="${m.id}">✏️ EDIT</button>` : ''}
        <button class="danger" data-action="delete" data-type="messages" data-id="${m.id}">🗑️ DELETE</button>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('panel-messages').addEventListener('click', e => {
  const btn = e.target.closest('[data-action="edit-message"]');
  if(!btn) return;
  const row = btn.closest('.item-row');
  const current = row.querySelector('.item-main')?.textContent || '';
  openModal({
    title: 'Edit Message',
    fields: [{ key:'text_reply', label:'MESSAGE', type:'textarea', value: current }],
    onSave: async (vals) => {
      const { error } = await mainClient.from('messages_archive').update({ text_reply: vals.text_reply }).eq('id', btn.dataset.id);
      if(error) throw error;
      loadMessages();
    }
  });
});

// ============ GALLERY ============
async function loadGallery(){
  const panel = document.getElementById('panel-gallery');
  panel.innerHTML = '<div class="empty-note">loading…</div>';
  const { data, error } = await galleryClient.from('gallery_items')
    .select('id, media_url, media_type, media_name, created_at')
    .order('created_at', { ascending:false });
  if(error){ panel.innerHTML = `<div class="empty-note">could not load: ${escapeHtml(error.message)}</div>`; return; }

  let html = `<button class="add-btn" id="galUploadBtn">＋ UPLOAD MEDIA</button>`;
  if(!data || !data.length){
    html += '<div class="empty-note">No media uploaded yet.</div>';
  } else {
    html += data.map(g => `
      <div class="item-row" data-id="${g.id}">
        <div class="item-top">
          <span class="item-meta">${g.media_type==='video'?'🎥':'📷'} ${escapeHtml(g.media_name||'')}</span>
          <span class="item-meta">${fmtDateTime(g.created_at)}</span>
        </div>
        ${g.media_type==='video'
          ? `<video class="item-thumb" src="${g.media_url}" controls></video>`
          : `<img class="item-thumb" src="${g.media_url}">`}
        <div class="item-actions">
          <a href="${g.media_url}" target="_blank" style="text-decoration:none;"><button type="button">VIEW</button></a>
          <button class="danger" data-action="delete" data-type="gallery" data-id="${g.id}">🗑️ DELETE</button>
        </div>
      </div>`).join('');
  }
  panel.innerHTML = html;
  document.getElementById('galUploadBtn').onclick = () => uploadModal.classList.add('open');
}

const uploadModal = document.getElementById('uploadModal');
document.getElementById('uploadCancel').onclick = () => uploadModal.classList.remove('open');
uploadModal.addEventListener('click', e => { if(e.target===uploadModal) uploadModal.classList.remove('open'); });
document.getElementById('upPhoto').addEventListener('change', e => { if(e.target.files[0]) doGalleryUpload(e.target.files[0],'image'); });
document.getElementById('upVideo').addEventListener('change', e => { if(e.target.files[0]) doGalleryUpload(e.target.files[0],'video'); });

async function doGalleryUpload(file, type){
  const msg = document.getElementById('uploadMsg');
  msg.textContent = 'uploading…';
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const path = `${type}/${Date.now()}_${safeName}`;
  const { error: upErr } = await galleryClient.storage.from('gallery').upload(path, file, { cacheControl:'3600', upsert:false });
  if(upErr){ msg.textContent = 'upload failed: ' + upErr.message; return; }
  const { data: pub } = galleryClient.storage.from('gallery').getPublicUrl(path);
  const { error: insErr } = await galleryClient.from('gallery_items').insert({ media_url: pub.publicUrl, media_type: type, media_name: file.name });
  if(insErr){ msg.textContent = 'saved file, but could not list it: ' + insErr.message; return; }
  msg.textContent = '✓ uploaded';
  setTimeout(() => { uploadModal.classList.remove('open'); msg.textContent=''; loadGallery(); }, 600);
}

// ============ CALENDAR ============
async function loadCalendar(){
  const panel = document.getElementById('panel-calendar');
  panel.innerHTML = '<div class="empty-note">loading…</div>';
  const { data, error } = await galleryClient.from('calendar_memories')
    .select('id, memory_date, types, title, description')
    .order('memory_date', { ascending:true });
  if(error){ panel.innerHTML = `<div class="empty-note">could not load: ${escapeHtml(error.message)}</div>`; return; }

  let html = `<button class="add-btn" data-action="add-calendar">＋ ADD NEW MEMORY</button>`;
  if(!data || !data.length){ html += '<div class="empty-note">No memories yet.</div>'; }
  else {
    html += data.map(c => `
      <div class="item-row">
        <div class="item-top">
          <span class="item-meta">${fmtDate(c.memory_date)}</span>
        </div>
        <div class="item-main">${escapeHtml(c.types||'')} ${escapeHtml(c.title)}</div>
        ${c.description ? `<div class="item-meta" style="margin-top:4px;">${escapeHtml(c.description)}</div>` : ''}
        <div class="item-actions">
          <button data-action="edit-calendar" data-id="${c.id}">✏️ EDIT</button>
          <button class="danger" data-action="delete" data-type="calendar" data-id="${c.id}">🗑️ DELETE</button>
        </div>
      </div>`).join('');
  }
  panel.innerHTML = html;
  window._calendarData = data || [];
}

document.getElementById('panel-calendar').addEventListener('click', e => {
  if(e.target.closest('[data-action="add-calendar"]')){
    openModal({
      title:'Add New Memory',
      fields:[
        {key:'memory_date', label:'DATE', type:'date', value:new Date().toISOString().slice(0,10)},
        {key:'types', label:'TYPES (comma-separated: love, eye, special, birthday, conversation, photo, song, difficult, story, other)', type:'text', value:'other'},
        {key:'title', label:'TITLE', type:'text', value:''},
        {key:'description', label:'DESCRIPTION (optional)', type:'textarea', value:''}
      ],
      onSave: async (vals) => {
        const { error } = await galleryClient.from('calendar_memories').insert(vals);
        if(error) throw error;
        loadCalendar();
      }
    });
    return;
  }
  const editBtn = e.target.closest('[data-action="edit-calendar"]');
  if(editBtn){
    const item = (window._calendarData||[]).find(c=>c.id===editBtn.dataset.id);
    if(!item) return;
    openModal({
      title:'Edit Memory',
      fields:[
        {key:'memory_date', label:'DATE', type:'date', value:item.memory_date},
        {key:'types', label:'TYPES (comma-separated)', type:'text', value:item.types},
        {key:'title', label:'TITLE', type:'text', value:item.title},
        {key:'description', label:'DESCRIPTION', type:'textarea', value:item.description||''}
      ],
      onSave: async (vals) => {
        const { error } = await galleryClient.from('calendar_memories').update(vals).eq('id', item.id);
        if(error) throw error;
        loadCalendar();
      }
    });
  }
});

// ============ LETTERS ============
async function loadLetters(){
  const panel = document.getElementById('panel-letters');
  panel.innerHTML = '<div class="empty-note">loading…</div>';
  const { data, error } = await galleryClient.from('letters')
    .select('id, letter_date, title, category, recipient, content, pinned')
    .order('letter_date', { ascending:true });
  if(error){ panel.innerHTML = `<div class="empty-note">could not load: ${escapeHtml(error.message)}</div>`; return; }

  let html = `<button class="add-btn" data-action="add-letter">＋ NEW LETTER</button>`;
  if(!data || !data.length){ html += '<div class="empty-note">No letters yet.</div>'; }
  else {
    html += data.map((l,i) => `
      <div class="item-row">
        <div class="item-top">
          <span class="item-meta">LETTER #${String(i+1).padStart(2,'0')} • ${fmtDate(l.letter_date)}</span>
          ${l.pinned ? '<span class="pin-tag">📌 PINNED</span>' : ''}
        </div>
        <div class="item-main">${escapeHtml(l.title || 'Untitled Letter')}</div>
        <div class="item-actions">
          <button data-action="edit-letter" data-id="${l.id}">✏️ EDIT</button>
          <button class="danger" data-action="delete" data-type="letters" data-id="${l.id}">🗑️ DELETE</button>
        </div>
      </div>`).join('');
  }
  panel.innerHTML = html;
  window._lettersData = data || [];
}

const LETTER_CATS = ['love','unsent','latenight','special','unspoken','apology','future','memory','other'];

document.getElementById('panel-letters').addEventListener('click', e => {
  if(e.target.closest('[data-action="add-letter"]')){
    openModal({
      title:'New Letter',
      fields:[
        {key:'letter_date', label:'DATE', type:'date', value:new Date().toISOString().slice(0,10)},
        {key:'title', label:'TITLE (optional)', type:'text', value:''},
        {key:'category', label:'CATEGORY', type:'select', options:LETTER_CATS, value:'other'},
        {key:'recipient', label:'TO (optional)', type:'text', value:''},
        {key:'content', label:'LETTER', type:'textarea', value:''},
        {key:'pinned', label:'Mark as most special', type:'checkbox', value:false}
      ],
      onSave: async (vals) => {
        if(vals.pinned) await galleryClient.from('letters').update({pinned:false}).eq('pinned',true);
        const { error } = await galleryClient.from('letters').insert(vals);
        if(error) throw error;
        loadLetters();
      }
    });
    return;
  }
  const editBtn = e.target.closest('[data-action="edit-letter"]');
  if(editBtn){
    const item = (window._lettersData||[]).find(l=>l.id===editBtn.dataset.id);
    if(!item) return;
    openModal({
      title:'Edit Letter',
      fields:[
        {key:'letter_date', label:'DATE', type:'date', value:item.letter_date},
        {key:'title', label:'TITLE', type:'text', value:item.title||''},
        {key:'category', label:'CATEGORY', type:'select', options:LETTER_CATS, value:item.category},
        {key:'recipient', label:'TO', type:'text', value:item.recipient||''},
        {key:'content', label:'LETTER', type:'textarea', value:item.content},
        {key:'pinned', label:'Mark as most special', type:'checkbox', value:!!item.pinned}
      ],
      onSave: async (vals) => {
        if(vals.pinned) await galleryClient.from('letters').update({pinned:false}).eq('pinned',true);
        const { error } = await galleryClient.from('letters').update(vals).eq('id', item.id);
        if(error) throw error;
        loadLetters();
      }
    });
  }
});

// ============ STORY ============
async function loadStory(){
  const panel = document.getElementById('panel-story');
  panel.innerHTML = '<div class="empty-note">loading…</div>';
  const { data, error } = await galleryClient.from('story_chapters')
    .select('id, chapter_number, title, date, story_content')
    .order('chapter_number', { ascending:true });
  if(error){ panel.innerHTML = `<div class="empty-note">could not load: ${escapeHtml(error.message)}</div>`; return; }

  let html = `<button class="add-btn" data-action="add-story">＋ ADD NEW CHAPTER</button>`;
  if(!data || !data.length){ html += '<div class="empty-note">No chapters yet.</div>'; }
  else {
    html += data.map(c => `
      <div class="item-row">
        <div class="item-top">
          <span class="item-meta">CHAPTER ${String(c.chapter_number).padStart(2,'0')}</span>
          <span class="item-meta">${c.date ? fmtDate(c.date) : ''}</span>
        </div>
        <div class="item-main">${escapeHtml(c.title)}</div>
        <div class="item-meta" style="margin-top:4px;">${c.story_content ? 'has content' : 'placeholder only'}</div>
        <div class="item-actions">
          <button data-action="edit-story" data-id="${c.id}">✏️ EDIT</button>
          <button class="danger" data-action="delete" data-type="story" data-id="${c.id}">🗑️ DELETE</button>
        </div>
      </div>`).join('');
  }
  panel.innerHTML = html;
  window._storyData = data || [];
}

document.getElementById('panel-story').addEventListener('click', e => {
  if(e.target.closest('[data-action="add-story"]')){
    const nextNum = (window._storyData||[]).length ? Math.max(...window._storyData.map(c=>c.chapter_number))+1 : 1;
    openModal({
      title:'Add New Chapter',
      fields:[
        {key:'chapter_number', label:'CHAPTER NUMBER', type:'number', value:nextNum},
        {key:'title', label:'CHAPTER TITLE', type:'text', value:''},
        {key:'date', label:'DATE (optional)', type:'date', value:''},
        {key:'story_content', label:'STORY CONTENT (optional)', type:'textarea', value:''}
      ],
      onSave: async (vals) => {
        if(!vals.date) vals.date = null;
        if(!vals.story_content) vals.story_content = null;
        const { error } = await galleryClient.from('story_chapters').insert(vals);
        if(error) throw error;
        loadStory();
      }
    });
    return;
  }
  const editBtn = e.target.closest('[data-action="edit-story"]');
  if(editBtn){
    const item = (window._storyData||[]).find(c=>c.id===editBtn.dataset.id);
    if(!item) return;
    openModal({
      title:'Edit Chapter',
      fields:[
        {key:'chapter_number', label:'CHAPTER NUMBER', type:'number', value:item.chapter_number},
        {key:'title', label:'CHAPTER TITLE', type:'text', value:item.title},
        {key:'date', label:'DATE', type:'date', value:item.date||''},
        {key:'story_content', label:'STORY CONTENT', type:'textarea', value:item.story_content||''}
      ],
      onSave: async (vals) => {
        if(!vals.date) vals.date = null;
        if(!vals.story_content) vals.story_content = null;
        const { error } = await galleryClient.from('story_chapters').update(vals).eq('id', item.id);
        if(error) throw error;
        loadStory();
      }
    });
  }
});

// ============ GENERIC MODAL ============
const modalPanel = document.getElementById('modalPanel');
const modalFields = document.getElementById('modalFields');
const modalMsg = document.getElementById('modalMsg');
let currentSave = null;

function openModal({ title, fields, onSave }){
  document.getElementById('modalTitle').textContent = title;
  modalMsg.textContent = '';
  modalFields.innerHTML = fields.map(f => {
    if(f.type==='textarea'){
      return `<div class="field"><label>${f.label}</label><textarea data-key="${f.key}">${escapeHtml(f.value||'')}</textarea></div>`;
    }
    if(f.type==='select'){
      return `<div class="field"><label>${f.label}</label><select data-key="${f.key}">
        ${f.options.map(o=>`<option value="${o}" ${o===f.value?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
    }
    if(f.type==='checkbox'){
      return `<div class="field checkline"><input type="checkbox" data-key="${f.key}" id="chk-${f.key}" ${f.value?'checked':''}><label for="chk-${f.key}">${f.label}</label></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input type="${f.type}" data-key="${f.key}" value="${escapeHtml(String(f.value ?? ''))}"></div>`;
  }).join('');
  currentSave = onSave;
  modalPanel.classList.add('open');
}
document.getElementById('modalCancel').onclick = () => modalPanel.classList.remove('open');
modalPanel.addEventListener('click', e => { if(e.target===modalPanel) modalPanel.classList.remove('open'); });

document.getElementById('modalSave').onclick = async () => {
  const vals = {};
  modalFields.querySelectorAll('[data-key]').forEach(el => {
    if(el.type==='checkbox') vals[el.dataset.key] = el.checked;
    else if(el.type==='number') vals[el.dataset.key] = parseInt(el.value,10);
    else vals[el.dataset.key] = el.value;
  });
  const btn = document.getElementById('modalSave');
  btn.disabled = true;
  modalMsg.textContent = 'saving…';
  try{
    await currentSave(vals);
    modalMsg.textContent = '✓ saved';
    setTimeout(() => { modalPanel.classList.remove('open'); btn.disabled=false; }, 400);
  }catch(err){
    console.error('admin save error:', err);
    modalMsg.textContent = 'could not save: ' + (err.message||'unknown error');
    btn.disabled = false;
  }
};

// ============ GENERIC DELETE ============
const TABLE_MAP = {
  messages: { client: mainClient, table:'messages_archive', reload: loadMessages },
  gallery: { client: galleryClient, table:'gallery_items', reload: loadGallery },
  calendar: { client: galleryClient, table:'calendar_memories', reload: loadCalendar },
  letters: { client: galleryClient, table:'letters', reload: loadLetters },
  story: { client: galleryClient, table:'story_chapters', reload: loadStory }
};
const confirmPanel = document.getElementById('confirmPanel');
let pendingDelete = null;

document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-action="delete"]');
  if(!btn) return;
  pendingDelete = { type: btn.dataset.type, id: btn.dataset.id };
  confirmPanel.classList.add('open');
});
document.getElementById('confirmCancel').onclick = () => { confirmPanel.classList.remove('open'); pendingDelete=null; };
document.getElementById('confirmDelete').onclick = async () => {
  if(!pendingDelete) return;
  const cfg = TABLE_MAP[pendingDelete.type];
  const { error } = await cfg.client.from(cfg.table).delete().eq('id', pendingDelete.id);
  confirmPanel.classList.remove('open');
  if(error){ console.error('delete error:', error); return; }
  cfg.reload();
  pendingDelete = null;
};
</script>
